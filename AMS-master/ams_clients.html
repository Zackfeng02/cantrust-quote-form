<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMS · Clients</title>
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="ams_i18n.js"></script>
<script src="ams_bootstrap.js"></script>
<style>
/* ── Reset & Variables ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --navy:       #0d1b2a;
  --navy-mid:   #152336;
  --navy-light: #1e3450;
  --navy-hover: #243d5e;
  --accent:     #e8a020;
  --accent-dim: #c4851a;
  --red:        #e05252;
  --green:      #3fc98b;
  --blue:       #4a9edd;
  --text-1:     #f0f4f8;
  --text-2:     #a8bcd0;
  --text-3:     #607a93;
  --border:     rgba(255,255,255,0.07);
  --card-bg:    #ffffff;
  --page-bg:    #f0f4f8;
  --card-border:#e2e8f0;
  --dark-text:  #1a2e42;
  --mid-text:   #4a6478;
}
body { font-family: 'Outfit', sans-serif; background: var(--page-bg); color: var(--dark-text); min-height: 100vh; display: flex; overflow-x: hidden; }

/* ── Sidebar ── */
.sidebar { width: 240px; min-height: 100vh; background: var(--navy); display: flex; flex-direction: column; position: fixed; left: 0; top: 0; bottom: 0; z-index: 100; border-right: 1px solid var(--border); }
.sidebar-logo { padding: 28px 24px 24px; border-bottom: 1px solid var(--border); }
.logo-mark { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 20px; color: var(--text-1); letter-spacing: -0.5px; }
.logo-mark span { color: var(--accent); }
.logo-sub { font-size: 11px; color: var(--text-3); margin-top: 3px; letter-spacing: 0.5px; text-transform: uppercase; }
.sidebar-nav { flex: 1; padding: 16px 12px; }
.nav-section-label { font-size: 10px; color: var(--text-3); text-transform: uppercase; letter-spacing: 1px; padding: 8px 12px 4px; margin-top: 8px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; color: var(--text-2); font-size: 14px; font-weight: 400; cursor: pointer; transition: all 0.15s; margin-bottom: 2px; text-decoration: none; }
.nav-item:hover { background: var(--navy-hover); color: var(--text-1); }
.nav-item.active { background: var(--navy-light); color: var(--text-1); font-weight: 500; }
.nav-item.active .nav-icon { color: var(--accent); }
.nav-icon { font-size: 16px; width: 20px; text-align: center; }
.sidebar-footer { padding: 16px 12px; border-top: 1px solid var(--border); }
.user-chip { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; background: var(--navy-mid); }
.user-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: var(--navy); flex-shrink: 0; }
.user-name { font-size: 13px; color: var(--text-1); font-weight: 500; }
.user-role { font-size: 11px; color: var(--text-3); }

.lang-toggle{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;cursor:pointer;transition:background .15s;margin-bottom:8px;color:var(--text-2);font-size:13px}
.lang-toggle:hover{background:rgba(255,255,255,.06);color:var(--text-1)}
.lang-icon{font-size:16px}
.lang-label{font-weight:600;letter-spacing:.5px}

/* ── Hamburger (mobile) ── */
.hamburger { display: none; background: none; border: none; color: var(--text-1); font-size: 22px; cursor: pointer; padding: 8px; }
.sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 99; }
.sidebar-overlay.open { display: block; }

/* ── Main ── */
.main { margin-left: 240px; flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
.topbar { background: var(--card-bg); border-bottom: 1px solid var(--card-border); padding: 0 32px; height: 64px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
.topbar-left { display: flex; align-items: center; gap: 12px; }
.topbar-title { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 700; }
.topbar-right { display: flex; align-items: center; gap: 8px; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; transition: all 0.15s; font-family: 'Outfit', sans-serif; }
.btn-primary { background: var(--navy); color: #fff; }
.btn-primary:hover { background: var(--navy-light); }
.btn-ghost { background: transparent; color: var(--mid-text); border: 1px solid var(--card-border); }
.btn-ghost:hover { background: var(--page-bg); }
.btn-danger { background: #fff0f0; color: var(--red); border: 1px solid #ffd5d5; }
.btn-danger:hover { background: #ffe0e0; }
.btn-sm { padding: 5px 10px; font-size: 12px; }

/* ── More Menu ── */
.more-menu-wrap { position: relative; }
.more-menu { position: absolute; right: 0; top: calc(100% + 8px); background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); min-width: 160px; z-index: 200; display: none; }
.more-menu.open { display: block; }
.more-menu-item { display: flex; align-items: center; gap: 8px; padding: 10px 14px; font-size: 13px; color: var(--dark-text); cursor: pointer; transition: background 0.12s; }
.more-menu-item:hover { background: var(--page-bg); }
.more-menu-item:first-child { border-radius: 10px 10px 0 0; }
.more-menu-item:last-child { border-radius: 0 0 10px 10px; }

/* ── Content ── */
.content { padding: 24px 32px; flex: 1; }

/* ── Toolbar ── */
.toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.search-wrap { position: relative; flex: 1; min-width: 200px; }
.search-input { width: 100%; padding: 9px 12px 9px 36px; border: 1px solid var(--card-border); border-radius: 8px; font-size: 13px; font-family: 'Outfit', sans-serif; background: var(--card-bg); color: var(--dark-text); outline: none; transition: border-color 0.15s; }
.search-input:focus { border-color: var(--accent); }
.search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); font-size: 14px; color: var(--mid-text); pointer-events: none; }
.filter-btn { padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; border: 1px solid var(--card-border); background: var(--card-bg); color: var(--mid-text); transition: all 0.12s; font-family: 'Outfit', sans-serif; white-space: nowrap; }
.filter-btn.active { background: var(--navy); color: #fff; border-color: var(--navy); }

/* ── Table ── */
.table-wrap { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; overflow: hidden; }
.table-meta { padding: 12px 20px; font-size: 12px; color: var(--mid-text); border-bottom: 1px solid var(--card-border); }
table { width: 100%; border-collapse: collapse; }
thead th { padding: 10px 16px; text-align: left; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--mid-text); border-bottom: 1px solid var(--card-border); background: #fafbfc; }
tbody tr { border-bottom: 1px solid #f5f7fa; transition: background 0.1s; cursor: pointer; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: #f8faff; }
tbody td { padding: 12px 16px; font-size: 13px; color: var(--dark-text); }
.td-code { font-family: monospace; font-size: 12px; color: var(--mid-text); }
.td-name { font-weight: 500; }
.td-secondary { color: var(--mid-text); font-size: 12px; }
.client-avatar-sm { width: 32px; height: 32px; border-radius: 8px; background: var(--navy); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-family: 'Syne', sans-serif; font-size: 12px; font-weight: 700; flex-shrink: 0; vertical-align: middle; margin-right: 8px; }
.client-avatar-sm.commercial { background: #4a2d7a; }

/* ── Badges ── */
.renewal-badge { display: inline-block; padding: 3px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; white-space: nowrap; }
.renewal-urgent  { background: #fff0f0; color: var(--red); border: 1px solid #ffd5d5; }
.renewal-warning { background: #fff8e8; color: #b06000; border: 1px solid #ffd580; }
.tasks-badge { display: inline-block; padding: 3px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; background: #e8f4ff; color: #1a6baa; }

/* ── Empty / Loading ── */
.table-empty { padding: 48px 20px; text-align: center; color: var(--mid-text); }
.table-empty-icon { font-size: 32px; opacity: 0.3; display: block; margin-bottom: 10px; }
.spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid var(--card-border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-row td { padding: 32px; text-align: center; color: var(--mid-text); }

/* ── Sentinel (infinite scroll) ── */
#scroll-sentinel { height: 1px; }
.load-more-indicator { text-align: center; padding: 16px; color: var(--mid-text); font-size: 13px; display: none; }
.load-more-indicator.visible { display: block; }

/* ── Modals ── */
.modal-overlay { position: fixed; inset: 0; background: rgba(13,27,42,0.6); backdrop-filter: blur(4px); z-index: 200; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal { background: var(--card-bg); border-radius: 16px; width: 620px; max-width: 96vw; max-height: 90vh; overflow-y: auto; transform: translateY(12px); transition: transform 0.2s; box-shadow: 0 24px 64px rgba(0,0,0,0.2); }
.modal-overlay.open .modal { transform: none; }
.modal-header { padding: 24px 24px 16px; border-bottom: 1px solid var(--card-border); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: var(--card-bg); z-index: 1; }
.modal-title { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 700; }
.modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--mid-text); padding: 4px; border-radius: 4px; }
.modal-close:hover { color: var(--dark-text); background: var(--page-bg); }
.modal-body { padding: 24px; }
.modal-footer { padding: 16px 24px; border-top: 1px solid var(--card-border); display: flex; justify-content: flex-end; gap: 10px; }

/* ── Form ── */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-group.full { grid-column: 1 / -1; }
.form-label { font-size: 12px; font-weight: 500; color: var(--mid-text); }
.form-label .req { color: var(--red); margin-left: 2px; }
.form-input, .form-select, .form-textarea { padding: 9px 12px; border: 1px solid var(--card-border); border-radius: 8px; font-size: 14px; font-family: 'Outfit', sans-serif; color: var(--dark-text); background: #fff; outline: none; transition: border-color 0.15s; }
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); }
.form-textarea { resize: vertical; min-height: 80px; }
.form-hint { font-size: 11px; color: var(--mid-text); }
.form-error { color: var(--red); font-size: 12px; }
.form-section-title { font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700; color: var(--dark-text); margin: 20px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--card-border); grid-column: 1 / -1; }

/* ── Toast ── */
.toast { position: fixed; bottom: 24px; right: 24px; z-index: 999; background: var(--navy); color: var(--text-1); padding: 12px 20px; border-radius: 10px; font-size: 14px; font-weight: 500; box-shadow: 0 8px 32px rgba(0,0,0,0.2); transform: translateY(80px); opacity: 0; transition: all 0.25s; }
.toast.show { transform: none; opacity: 1; }
.toast.success { border-left: 3px solid var(--green); }
.toast.error   { border-left: 3px solid var(--red); }

/* ── Config screen ── */
#config-screen { position: fixed; inset: 0; background: var(--navy); display: flex; align-items: center; justify-content: center; z-index: 9999; }
.config-card { background: var(--navy-mid); border: 1px solid var(--border); border-radius: 16px; padding: 40px; width: 440px; max-width: 90vw; }
.config-logo { font-family: 'Syne', sans-serif; font-size: 24px; font-weight: 800; color: var(--text-1); margin-bottom: 6px; }
.config-logo span { color: var(--accent); }
.config-sub { font-size: 13px; color: var(--text-3); margin-bottom: 28px; }
.config-field { margin-bottom: 16px; }
.config-label { font-size: 12px; color: var(--text-2); margin-bottom: 6px; font-weight: 500; display: block; }
.config-input { width: 100%; background: var(--navy); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; color: var(--text-1); font-size: 13px; font-family: 'Outfit', sans-serif; outline: none; transition: border-color 0.15s; }
.config-input:focus { border-color: var(--accent); }
.config-btn { width: 100%; padding: 12px; background: var(--accent); color: var(--navy); border: none; border-radius: 8px; font-size: 14px; font-weight: 700; font-family: 'Syne', sans-serif; cursor: pointer; margin-top: 8px; }
.config-btn:hover { background: var(--accent-dim); }
.config-error { color: #ff7070; font-size: 12px; margin-top: 10px; display: none; }

/* ── Clickable name link ── */
.td-name-link { text-decoration: none; color: inherit; display: inline-flex; align-items: center; }
.td-name-link:hover .td-name { color: var(--blue); text-decoration: underline; }

/* ── Mobile ── */
@media (max-width: 768px) {
  .sidebar { transform: translateX(-100%); transition: transform 0.25s; }
  .sidebar.open { transform: none; }
  .main { margin-left: 0; }
  .hamburger { display: block; }
  .topbar { padding: 0 16px; }
  .content { padding: 16px; }
  .desktop-only { display: none; }
  thead th:nth-child(3), thead th:nth-child(4), tbody td:nth-child(3), tbody td:nth-child(4) { display: none; }
  .form-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- Config screen -->
<div id="config-screen">
  <div class="config-card">
    <div class="config-logo">AMS<span>·</span></div>
    <div class="config-sub" data-i18n="cfg_sub">Enter your Supabase credentials</div>
    <div class="config-field">
      <label class="config-label" data-i18n="cfg_url_label">Project URL</label>
      <input class="config-input" id="cfg-url" type="text" placeholder="https://xxxxxxxxxx.supabase.co">
    </div>
    <div class="config-field">
      <label class="config-label" data-i18n="cfg_key_label">Anon Public Key</label>
      <input class="config-input" id="cfg-key" type="password" placeholder="eyJ...">
    </div>
    <button class="config-btn" onclick="connectSupabase()" data-i18n="cfg_connect">Connect</button>
    <div class="config-error" id="cfg-error"></div>
  </div>
</div>

<!-- Sidebar overlay (mobile) -->
<div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="logo-mark">AMS<span>·</span></div>
    <div class="logo-sub">Insurance Manager</div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-section-label" data-i18n="nav_main">主菜单</div>
    <a class="nav-item" href="ams_dashboard.html"><span class="nav-icon">⊞</span><span class="nav-label" data-i18n="nav_dashboard">仪表盘</span></a>
    <a class="nav-item active" href="ams_clients.html"><span class="nav-icon">👤</span><span class="nav-label" data-i18n="nav_clients">客户管理</span></a>
    <a class="nav-item" href="ams_policies.html"><span class="nav-icon">📋</span><span class="nav-label" data-i18n="nav_policies">保单管理</span></a>
    <a class="nav-item" href="ams_tasks.html"><span class="nav-icon">✓</span><span class="nav-label" data-i18n="nav_tasks">待办任务</span></a>
    <div class="nav-section-label" style="margin-top:16px" data-i18n="nav_business">业务</div>
    <a class="nav-item" href="ams_quotes.html"><span class="nav-icon">💲</span><span class="nav-label" data-i18n="nav_quotes">新客户报价</span></a>
    <a class="nav-item" href="ams_import_quote.html"><span class="nav-icon">📥</span><span class="nav-label" data-i18n="nav_import">报价导入</span></a>
    <a class="nav-item" href="ams_renewal.html"><span class="nav-icon">🔄</span><span class="nav-label" data-i18n="nav_renewal">续保对比</span></a>
    <div class="nav-section-label" style="margin-top:16px" data-i18n="nav_records">记录</div>
    <a class="nav-item" href="ams_changes.html"><span class="nav-icon">📝</span><span class="nav-label" data-i18n="nav_changes">变更记录</span></a>
    <a class="nav-item" href="ams_reports.html"><span class="nav-icon">📊</span><span class="nav-label" data-i18n="nav_reports">报表</span></a>
  </nav>
  <div class="sidebar-footer">
    <div class="lang-toggle" onclick="toggleLang()" title="Switch Language">
      <span class="lang-icon">🌐</span>
      <span class="lang-label" id="lang-label">EN</span>
    </div>
    <div class="user-chip">
      <div class="user-avatar">A</div>
      <div><div class="user-name" data-i18n="user_name">独立经纪人</div><div class="user-role">Administrator</div></div>
    </div>
  </div>
</aside>

<!-- Main -->
<div class="main">
  <header class="topbar">
    <div class="topbar-left">
      <button class="hamburger" onclick="openSidebar()">☰</button>
      <div class="topbar-title" data-i18n="page_title">客户管理</div>
    </div>
    <div class="topbar-right">
      <button class="btn btn-primary desktop-only" onclick="openNewClientModal()" data-i18n="btn_new_client">＋ 新增客户</button>
      <button class="btn btn-ghost desktop-only" onclick="exportCSV()" data-i18n="btn_export">↓ 导出</button>
      <button class="btn btn-ghost desktop-only" onclick="document.getElementById('csv-file').click()" data-i18n="btn_import">↑ 导入</button>
      <input type="file" id="csv-file" accept=".csv" style="display:none" onchange="handleCSVFile(event)">
      <!-- Mobile more menu -->
      <div class="more-menu-wrap">
        <button class="btn btn-ghost" id="more-btn" onclick="toggleMoreMenu()" style="display:none">⋯</button>
        <div class="more-menu" id="more-menu">
          <div class="more-menu-item" onclick="openNewClientModal();toggleMoreMenu()" data-i18n="btn_new_client">＋ 新增客户</div>
          <div class="more-menu-item" onclick="exportCSV();toggleMoreMenu()" data-i18n="menu_export_csv">↓ 导出 CSV</div>
          <div class="more-menu-item" onclick="document.getElementById('csv-file').click();toggleMoreMenu()" data-i18n="menu_import_csv">↑ 导入 CSV</div>

        <span class="search-icon">🔍</span>

      </div>
      <button class="filter-btn active" id="filter-all" onclick="setFilter('all')" data-i18n="filter_all">全部</button>
      <button class="filter-btn" id="filter-renewal" onclick="setFilter('renewal')" data-i18n="filter_renewal">即将续保</button>
      <button class="filter-btn" id="filter-tasks" onclick="setFilter('tasks')" data-i18n="filter_tasks">待办任务</button>
    </div>

    <!-- Table -->
    <div class="table-wrap">
      <div class="table-meta" id="table-meta"></div>
      <table>
        <thead>
          <tr>
            <th data-i18n="th_name">姓名</th>
            <th data-i18n="th_code">编号</th>
            <th data-i18n="th_phone">电话</th>
            <th data-i18n="th_email">邮箱</th>
            <th data-i18n="th_renewal">续保</th>
            <th data-i18n="th_tasks">任务</th>
          </tr>
        </thead>
        <tbody id="client-tbody">
          <tr class="loading-row"><td colspan="6"><span class="spinner"></span> <span data-i18n="loading">加载中…</span></td></tr>
        </tbody>
      </table>
      <div id="scroll-sentinel"></div>
      <div class="load-more-indicator" id="load-more-indicator"><span class="spinner"></span> <span data-i18n="loading_more">加载更多…</span></div>
    </div>
  </div>
</div>

<!-- New/Edit Client Modal -->
<div class="modal-overlay" id="client-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title" data-i18n="modal_new_client">新增客户</div>
      <button class="modal-close" onclick="safeCloseClientModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-section-title" data-i18n="section_basic">基本信息</div>
        <div class="form-group">
          <label class="form-label" data-i18n="label_code">客户编号<span class="req">*</span></label>
          <input class="form-input" id="f-code" type="text" data-i18n-ph="ph_code" placeholder="ABCD01" maxlength="6" style="text-transform:uppercase">
          <span class="form-hint" data-i18n="hint_code">4位大写字母 + 2位数字</span>
          <span class="form-error" id="f-code-err"></span>
        </div>

function getLang() {
  return window.__amsGetLang ? window.__amsGetLang() : (localStorage.getItem('ams_lang') || 'zh');
}

t = function(key, params) {
  LANG = getLang();
  let s = window.__amsT ? window.__amsT(key, LANG) : key;
  if (params) {
    for (const [k, v] of Object.entries(params)) s = s.replace(`{${k}}`, v);
  }
  return s;
};

  LANG = getLang();

// Auto-connect from shared local/browser bootstrap
(async function autoConnect() {
  const creds = window.AMSBootstrap ? await window.AMSBootstrap.getCredentials() : null;
  const url = creds?.url;
  const key = creds?.key;

  if (url && key) {
    document.getElementById('cfg-url').value = url;
    document.getElementById('cfg-key').value = key;
    db = window.supabase.createClient(url, key);
    if (window.AMSBootstrap) window.AMSBootstrap.storeCredentials(url, key);
    document.getElementById('config-screen').style.display = 'none';
    init();
  }
})();

async function connectSupabase() {
  const url = document.getElementById('cfg-url').value.trim();
  const key = document.getElementById('cfg-key').value.trim();
  const errEl = document.getElementById('cfg-error');
  errEl.style.display = 'none';
  if (!url || !key) { errEl.textContent = t('cfg_err_missing'); errEl.style.display = 'block'; return; }
  try {
    db = window.supabase.createClient(url, key);
    const { error } = await db.from('clients').select('id').limit(1);
    if (error) throw error;
    if (window.AMSBootstrap) window.AMSBootstrap.storeCredentials(url, key);
    document.getElementById('config-screen').style.display = 'none';
    init();
  } catch(e) {
    errEl.textContent = t('cfg_err_failed', {msg: e.message || 'Check credentials'});
    errEl.style.display = 'block';
  }
}

function showToast(msg, type='success') {
  const t = document.getElementById('toast');

// ─────────────────────────────────────────
// Task 2: Data Loading & Rendering
// ─────────────────────────────────────────
async function init() {
  checkResponsive();
  setupInfiniteScroll();
  await loadAllData();
}

async function loadAllData() {
  document.getElementById('client-tbody').innerHTML =
    `<tr class="loading-row"><td colspan="6"><span class="spinner"></span> ${esc(t('loading'))}</td></tr>`;
  try {
    const { data: clients, error: cErr } = await db
      .from('clients')
      .select('id, customer_code, full_name, client_type, phone, email, birthday, tags')
      .order('full_name', { ascending: true });
    if (cErr) throw cErr;
    allClients = clients || [];

    const { data: renewals } = await db
      .from('v_renewal_dashboard')
      .select('customer_code, expiry_date');
    renewalMap = {};
    (renewals || []).forEach(r => {
      if (!renewalMap[r.customer_code] || r.expiry_date < renewalMap[r.customer_code]) {
        renewalMap[r.customer_code] = r.expiry_date;
      }
    });

    const { data: tasks } = await db
      .from('tasks')
      .select('customer_code')
      .not('status', 'in', '("completed","abandoned")');
    taskCountMap = {};
    (tasks || []).forEach(t => {
      if (t.customer_code) taskCountMap[t.customer_code] = (taskCountMap[t.customer_code] || 0) + 1;
    });

    applyFilters();
  } catch(e) {
    showToast(e.message, 'error');
    document.getElementById('client-tbody').innerHTML =
      `<tr><td colspan="6" class="table-empty"><span class="table-empty-icon">⚠️</span>${esc(e.message)}</td></tr>`;
  }
}

function applyFilters() {
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  let result = allClients;

  if (activeFilter === 'renewal') {
    result = result.filter(c => renewalMap[c.customer_code]);
  } else if (activeFilter === 'tasks') {
    result = result.filter(c => taskCountMap[c.customer_code] > 0);
  }

  if (q) {
    result = result.filter(c =>
      c.full_name?.toLowerCase().includes(q) ||
      c.customer_code?.toLowerCase().includes(q) ||
      c.phone?.toLowerCase().includes(q)
    );
  }

  filteredClients = result;
  displayedRows = 0;
  document.getElementById('client-tbody').innerHTML = '';
  document.getElementById('table-meta').textContent = filteredClients.length === 1 ? t('table_meta_one') : t('table_meta', {count: filteredClients.length});
  renderNextPage();
}

function renderNextPage() {
  const slice = filteredClients.slice(displayedRows, displayedRows + PAGE_SIZE);
  if (slice.length === 0 && displayedRows === 0) {
    if (allClients.length === 0) {
      document.getElementById('client-tbody').innerHTML =
        `<tr><td colspan="6"><div class="table-empty">
          <span class="table-empty-icon">👤</span>
          ${esc(t('empty_no_clients'))} <button class="btn btn-primary btn-sm" onclick="openNewClientModal()">${esc(t('empty_add_first'))}</button>
          ${esc(t('empty_or'))} <button class="btn btn-ghost btn-sm" onclick="document.getElementById('csv-file').click()">${esc(t('empty_import_csv'))}</button>
        </div></td></tr>`;
    } else {
      document.getElementById('client-tbody').innerHTML =
        `<tr><td colspan="6"><div class="table-empty">
          <span class="table-empty-icon">🔍</span>
          ${esc(t('empty_no_match'))} <a href="#" onclick="clearFilters();return false">${esc(t('empty_clear_filters'))}</a>
        </div></td></tr>`;
    }
    return;
  }
  const tbody = document.getElementById('client-tbody');
  slice.forEach(c => {
    const initials = getInitials(c.full_name);
    const isCorporation = c.client_type === 'corporation';
    const expiry = renewalMap[c.customer_code];
    const taskCount = taskCountMap[c.customer_code] || 0;
    let renewalHtml = '';
    if (expiry) {
      const days = daysUntil(expiry);
      const cls = days <= 14 ? 'renewal-urgent' : 'renewal-warning';
      renewalHtml = `<span class="renewal-badge ${cls}">${esc(t('renews_in', {days}))}</span>`;
    }
    const tasksHtml = taskCount > 0
      ? `<span class="tasks-badge">${esc(t('task_count', {count: taskCount}))}</span>` : '';
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><a href="ams_client_detail.html?id=${esc(c.id)}" class="td-name-link"><span class="client-avatar-sm${isCorporation?' commercial':''}">${esc(initials)}</span><span class="td-name">${esc(c.full_name)}</span></a></td>
      <td class="td-code">${esc(c.customer_code)}</td>
      <td class="td-secondary">${esc(c.phone||'')}</td>
      <td class="td-secondary">${esc(c.email||'')}</td>
      <td>${renewalHtml}</td>
      <td>${tasksHtml}</td>`;
    tbody.appendChild(tr);
  });
  displayedRows += slice.length;
}

function clearFilters() {
  document.getElementById('search-input').value = '';
  setFilter('all');
}

function setFilter(name) {
  activeFilter = name;
  ['all','renewal','tasks'].forEach(f => {
    document.getElementById(`filter-${f}`).classList.toggle('active', f === name);
  });
  applyFilters();
}

// ── Search with two-query merge ──
document.getElementById('search-input').addEventListener('input', () => {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(runSearch, 300);
});

async function runSearch() {
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  if (!q) { applyFilters(); return; }

  const [clientRes, policyRes] = await Promise.all([
    db.from('clients')
      .select('id, customer_code, full_name, client_type, phone, email, birthday, tags')
      .or(`full_name.ilike.%${q}%,phone.ilike.%${q}%,customer_code.ilike.%${q}%`)
      .order('full_name'),
    db.from('policies')
      .select('customer_code')
      .ilike('policy_number', `%${q}%`)
  ]);

  const codeSet = new Set((policyRes.data || []).map(p => p.customer_code));
  const byPolicyCode = allClients.filter(c => codeSet.has(c.customer_code));
  const byClientFields = clientRes.data || [];

  const seen = new Set();
  const merged = [];
  [...byClientFields, ...byPolicyCode].forEach(c => {
    if (!seen.has(c.customer_code)) { seen.add(c.customer_code); merged.push(c); }
  });

  let result = merged;
  if (activeFilter === 'renewal') result = result.filter(c => renewalMap[c.customer_code]);
  if (activeFilter === 'tasks')   result = result.filter(c => taskCountMap[c.customer_code] > 0);

  filteredClients = result;
  displayedRows = 0;
  document.getElementById('client-tbody').innerHTML = '';
  document.getElementById('table-meta').textContent = filteredClients.length === 1 ? t('table_meta_one') : t('table_meta', {count: filteredClients.length});
  renderNextPage();
}

// ── Infinite Scroll ──
function setupInfiniteScroll() {
  const sentinel = document.getElementById('scroll-sentinel');
  const indicator = document.getElementById('load-more-indicator');
  const observer = new IntersectionObserver(entries => {
    if (entries[0].isIntersecting && displayedRows < filteredClients.length) {
      indicator.classList.add('visible');
      setTimeout(() => {
        renderNextPage();
        indicator.classList.remove('visible');
      }, 200);
    }
  }, { threshold: 0.1 });
  observer.observe(sentinel);
}

function closeClientModal() {

function safeCloseClientModal() {

  closeClientModal();
}

function clearClientForm() {
  ['f-code','f-firstname','f-middlename','f-lastname','f-businessname','f-phone','f-email','f-address','f-birthday','f-referral','f-tags','f-notes',
   'c1-name','c1-phone','c1-email','c1-birthday','c1-relation',

  });

  document.getElementById('c1-title').value = '';

}

async function saveClient() {
  const code = document.getElementById('f-code').value.trim().toUpperCase();
  const clientType = document.getElementById('f-type').value;
  let name = '';

  let valid = true;
  if (!code || !/^[A-Z]{4}[0-9]{2}$/.test(code)) {
    document.getElementById('f-code-err').textContent = t('err_code_format');
    valid = false;
  } else { document.getElementById('f-code-err').textContent = ''; }

  // Clear name errors
  document.getElementById('f-name-err').textContent = '';
  const lnErr = document.getElementById('f-lastname-err'); if (lnErr) lnErr.textContent = '';
  const bnErr = document.getElementById('f-businessname-err'); if (bnErr) bnErr.textContent = '';

  if (clientType === 'individual') {
    const first = document.getElementById('f-firstname').value.trim();
    const middle = document.getElementById('f-middlename').value.trim();
    const last = document.getElementById('f-lastname').value.trim();
    if (!first) { document.getElementById('f-name-err').textContent = t('err_firstname_required'); valid = false; }
    if (!last) { document.getElementById('f-lastname-err').textContent = t('err_lastname_required'); valid = false; }
    name = [first, middle, last].filter(Boolean).join(' ');
  } else {
    name = document.getElementById('f-businessname').value.trim();
    if (!name) { document.getElementById('f-businessname-err').textContent = t('err_businessname_required'); valid = false; }
  }

  if (!valid) return;

  const tags = document.getElementById('f-tags').value.trim()
    ? document.getElementById('f-tags').value.split(',').map(t => t.trim()).filter(Boolean)
    : [];

  const contact1 = buildContact('c1');
  const contact2 = buildContact('c2');

  const payload = {
    customer_code: code,
    full_name: name,
    client_type: clientType,
    phone: document.getElementById('f-phone').value.trim() || null,
    email: document.getElementById('f-email').value.trim() || null,
    address: document.getElementById('f-address').value.trim() || null,
    birthday: document.getElementById('f-birthday').value || null,
    referral_source: document.getElementById('f-referral').value.trim() || null,
    tags,
    notes: document.getElementById('f-notes').value.trim() || null,
    contact_1: contact1,
    contact_2: contact2,
  };

  const btn = document.getElementById('modal-save-btn');
  btn.disabled = true; btn.textContent = t('btn_saving');

  try {
    let error;
    if (editingId) {
      ({ error } = await db.from('clients').update(payload).eq('id', editingId));
    } else {
      ({ error } = await db.from('clients').insert(payload));
    }
    if (error) throw error;
    closeClientModal();
    showToast(editingId ? t('toast_client_updated') : t('toast_client_added'), 'success');
    await loadAllData();
  } catch(e) {
    showToast(e.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = t('btn_save_client');
  }
}

function buildContact(prefix) {
  const name = document.getElementById(`${prefix}-name`).value.trim();
  if (!name) return null;
  return {
    title:          document.getElementById(`${prefix}-title`).value || null,
    full_name:      name,
    phone:          document.getElementById(`${prefix}-phone`).value.trim() || null,
    email:          document.getElementById(`${prefix}-email`).value.trim() || null,
    birthday:       document.getElementById(`${prefix}-birthday`).value || null,
    marital_status: document.getElementById(`${prefix}-marital`).value || null,
    relation:       document.getElementById(`${prefix}-relation`).value.trim() || null,
  };
}

// ─────────────────────────────────────────
// Task 4: CSV Export
// ─────────────────────────────────────────
function exportCSV() {
  const headers = ['customer_code','full_name','client_type','phone','email','address','birthday',
                   'contact_1_name','contact_1_phone','contact_2_name','contact_2_phone'];
  fetchAndExport(headers);
}

async function fetchAndExport(headers) {
  try {
    let query = db.from('clients').select('customer_code,full_name,client_type,phone,email,address,birthday,contact_1,contact_2');
    if (activeFilter !== 'all' || document.getElementById('search-input').value.trim()) {
      const codes = filteredClients.map(c => c.customer_code);
      query = query.in('customer_code', codes);
    }
    const { data, error } = await query.order('full_name');
    if (error) throw error;

    const rows = (data||[]).map(c => [
      c.customer_code, c.full_name, c.client_type||'',
      c.phone||'', c.email||'', c.address||'', c.birthday||'',
      c.contact_1?.full_name||'', c.contact_1?.phone||'',
      c.contact_2?.full_name||'', c.contact_2?.phone||''
    ]);

    const csv = [headers, ...rows].map(r =>
      r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')
    ).join('\r\n');

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `ams-clients-${new Date().toISOString().slice(0,10)}.csv`;
    a.click(); URL.revokeObjectURL(url);
    showToast(t('toast_exported', {count: rows.length}));
  } catch(e) { showToast(e.message, 'error'); }
}

// ─────────────────────────────────────────
// Task 5: CSV Import
// ─────────────────────────────────────────
const CANONICAL_FIELDS = [
  { key: 'customer_code', i18nKey: 'csv_field_customer_code', required: true },
  { key: 'full_name',     i18nKey: 'csv_field_full_name',     required: true },
  { key: 'client_type',   i18nKey: 'csv_field_client_type',   required: false },
  { key: 'phone',         i18nKey: 'csv_field_phone',         required: false },
  { key: 'email',         i18nKey: 'csv_field_email',         required: false },
  { key: 'address',       i18nKey: 'csv_field_address',       required: false },
  { key: 'birthday',      i18nKey: 'csv_field_birthday',      required: false },
  { key: 'contact_1_name',  i18nKey: 'csv_field_contact_1_name',  required: false },
  { key: 'contact_1_phone', i18nKey: 'csv_field_contact_1_phone', required: false },
  { key: 'contact_2_name',  i18nKey: 'csv_field_contact_2_name',  required: false },
  { key: 'contact_2_phone', i18nKey: 'csv_field_contact_2_phone', required: false },
];
const REQUIRED_KEYS = CANONICAL_FIELDS.filter(f => f.required).map(f => f.key);
const CODE_RE = /^[A-Z]{4}[0-9]{2}$/;

function handleCSVFile(e) {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  if (!file.name.toLowerCase().endsWith('.csv')) {
    showToast(t('toast_csv_only'), 'error'); return;
  }
  if (file.size > 1024 * 1024) {
    showToast(t('toast_file_too_large'), 'error'); return;
  }
  const reader = new FileReader();
  reader.onload = ev => parseAndPreviewCSV(ev.target.result);
  reader.readAsText(file);
}

function parseCSVLine(line) {
  const result = []; let cur = ''; let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') { inQuotes = !inQuotes; }
    else if (ch === ',' && !inQuotes) { result.push(cur.trim()); cur = ''; }
    else { cur += ch; }
  }
  result.push(cur.trim());
  return result;
}

function parseAndPreviewCSV(text) {
  const lines = text.trim().split(/\r?\n/).filter(l => l.trim());
  if (lines.length < 2) { showToast(t('toast_csv_min_rows'), 'error'); return; }

  const headers = parseCSVLine(lines[0]).map(h => h.replace(/^"|"$/g,''));
  csvParsed = lines.slice(1).map(l => parseCSVLine(l).map(v => v.replace(/^"|"$/g,'')));

  csvMapping = {};
  CANONICAL_FIELDS.forEach(f => {
    const idx = headers.findIndex(h => h.toLowerCase().replace(/[\s_-]/g,'') === f.key.replace(/_/g,''));
    if (idx >= 0) csvMapping[f.key] = idx;
  });

  buildCSVPreview(headers);
}

function buildCSVPreview(csvHeaders) {
  const preview5 = csvParsed.slice(0, 5);
  const codeIdx = csvMapping['customer_code'];
  const warnings = codeIdx !== undefined
    ? preview5.filter(r => r[codeIdx] && !CODE_RE.test(r[codeIdx].toUpperCase())).map(r => r[codeIdx])
    : [];

  let html = `<p style="margin-bottom:16px;font-size:13px;color:var(--mid-text)">${esc(t('csv_rows_found', {count: csvParsed.length}))}</p>`;

  html += `<div style="margin-bottom:20px">
    <div style="font-family:'Syne',sans-serif;font-size:13px;font-weight:700;margin-bottom:10px">${esc(t('csv_column_mapping'))}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">`;
  CANONICAL_FIELDS.forEach(f => {
    const currentIdx = csvMapping[f.key] ?? '';
    const fieldLabel = t(f.i18nKey);
    html += `<div style="display:flex;align-items:center;gap:8px;font-size:13px">
      <label style="min-width:140px;color:var(--mid-text)">${esc(fieldLabel)}${f.required?' <span style="color:var(--red)">*</span>':''}</label>
      <select class="form-select" style="flex:1;font-size:12px" data-field="${f.key}" onchange="updateMapping('${f.key}',this.value)">
        <option value="">${esc(t('csv_skip'))}</option>
        ${csvHeaders.map((h,i) => `<option value="${i}" ${currentIdx===i?'selected':''}>${esc(h)}</option>`).join('')}
      </select>
    </div>`;
  });
  html += '</div></div>';

  if (warnings.length > 0) {
    html += `<div style="background:#fff0f0;border:1px solid #ffd5d5;border-radius:8px;padding:12px;margin-bottom:16px;font-size:13px;color:var(--red)">
      ⚠️ ${esc(t('csv_code_warning', {codes: warnings.join(', ')}))}</div>`;
  }

  html += `<div style="overflow-x:auto"><table style="width:100%;font-size:12px;border-collapse:collapse">
    <thead><tr>${csvHeaders.map(h=>`<th style="padding:6px;border-bottom:1px solid var(--card-border);text-align:left;color:var(--mid-text)">${esc(h)}</th>`).join('')}</tr></thead>
    <tbody>${preview5.map(r=>`<tr>${r.map(v=>`<td style="padding:6px;border-bottom:1px solid #f5f7fa">${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody>
  </table></div>`;

  document.getElementById('csv-modal-body').innerHTML = html;
  document.getElementById('csv-modal').classList.add('open');
  updateConfirmBtn();
}

function updateMapping(field, value) {
  if (value === '') { delete csvMapping[field]; }
  else { csvMapping[field] = parseInt(value); }
  updateConfirmBtn();
}

function updateConfirmBtn() {
  const allMapped = REQUIRED_KEYS.every(k => csvMapping[k] !== undefined);
  document.getElementById('csv-confirm-btn').disabled = !allMapped;
}

function closeCSVModal() { document.getElementById('csv-modal').classList.remove('open'); }

function safeCloseCSVModal() {
  if (!confirm(t('confirm_close'))) return;
  closeCSVModal();
}

async function runCSVImport() {
  const btn = document.getElementById('csv-confirm-btn');
  btn.disabled = true; btn.textContent = t('btn_importing');

  let added = 0, updated = 0, skipped = 0;
  for (const row of csvParsed) {
    const get = key => csvMapping[key] !== undefined ? (row[csvMapping[key]] || '').trim() : '';
    const code = get('customer_code').toUpperCase();
    const name = get('full_name');
    if (!code || !name) { skipped++; continue; }
    if (!CODE_RE.test(code)) { skipped++; continue; }

    const contact_1_name = get('contact_1_name');
    const contact_2_name = get('contact_2_name');
    const payload = {
      customer_code: code, full_name: name,
      client_type: get('client_type') || 'individual',
      phone: get('phone') || null, email: get('email') || null,
      address: get('address') || null, birthday: get('birthday') || null,
      contact_1: contact_1_name ? { full_name: contact_1_name, phone: get('contact_1_phone') || null } : null,
      contact_2: contact_2_name ? { full_name: contact_2_name, phone: get('contact_2_phone') || null } : null,
    };

    const { data: existing } = await db.from('clients').select('id').eq('customer_code', code).maybeSingle();
    if (existing) {
      const { error } = await db.from('clients').update(payload).eq('customer_code', code);
      if (error) { skipped++; } else { updated++; }
    } else {
      const { error } = await db.from('clients').insert(payload);
      if (error) { skipped++; } else { added++; }
    }
  }
  closeCSVModal();
  showToast(t('toast_import_complete', {added, updated, skipped}));
  await loadAllData();
  btn.disabled = false; btn.textContent = t('btn_confirm_import');
}

document.getElementById('client-modal').addEventListener('click', function(e) { if (e.target === this) safeCloseClientModal(); });
document.getElementById('csv-modal').addEventListener('click', function(e) { if (e.target === this) safeCloseCSVModal(); });
