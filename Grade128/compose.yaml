name: grade128
services:
  grade128:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "${GRADE128_BIND_IP:-0.0.0.0}:${GRADE128_PORT:-8000}:8000"
    volumes:
      - type: bind
        source: ./.data
        target: /data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3))['ok']"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
