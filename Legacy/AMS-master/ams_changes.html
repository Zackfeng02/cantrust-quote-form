<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMS · 变更记录</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="ams_bootstrap.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --navy:#0d1b2a; --navy-mid:#152336; --navy-light:#1e3450; --navy-hover:#243d5e;
  --accent:#e8a020; --accent-dim:#c4851a; --red:#e05252; --green:#3fc98b; --blue:#4a9edd;
  --text-1:#f0f4f8; --text-2:#a8bcd0; --text-3:#607a93; --border:rgba(255,255,255,0.07);
  --card-bg:#ffffff; --page-bg:#f0f4f8; --card-border:#e2e8f0; --dark-text:#1a2e42; --mid-text:#4a6478;
}
body { font-family:'Outfit',sans-serif; background:var(--page-bg); color:var(--dark-text); min-height:100vh; display:flex; overflow-x:hidden; }

/* Sidebar */
.sidebar { width:240px; min-height:100vh; background:var(--navy); display:flex; flex-direction:column; position:fixed; left:0; top:0; bottom:0; z-index:100; border-right:1px solid var(--border); }
.sidebar-logo { padding:28px 24px 24px; border-bottom:1px solid var(--border); }
.logo-mark { font-family:'Syne',sans-serif; font-weight:800; font-size:20px; color:var(--text-1); }
.logo-mark span { color:var(--accent); }
.logo-sub { font-size:11px; color:var(--text-3); margin-top:3px; letter-spacing:0.5px; text-transform:uppercase; }
.sidebar-nav { flex:1; padding:16px 12px; }
.nav-section-label { font-size:10px; color:var(--text-3); text-transform:uppercase; letter-spacing:1px; padding:8px 12px 4px; margin-top:8px; }
.nav-item { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; color:var(--text-2); font-size:14px; cursor:pointer; transition:all 0.15s; margin-bottom:2px; text-decoration:none; }
.nav-item:hover { background:var(--navy-hover); color:var(--text-1); }
.nav-item.active { background:var(--navy-light); color:var(--text-1); font-weight:500; }
.nav-item.active .nav-icon { color:var(--accent); }
.nav-icon { font-size:16px; width:20px; text-align:center; }
.sidebar-footer { padding:16px 12px; border-top:1px solid var(--border); }
.user-chip { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; background:var(--navy-mid); }
.user-avatar { width:32px; height:32px; border-radius:50%; background:var(--accent); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; color:var(--navy); flex-shrink:0; }
.user-name { font-size:13px; color:var(--text-1); font-weight:500; }
.user-role { font-size:11px; color:var(--text-3); }

/* Main */
.main { margin-left:240px; flex:1; display:flex; flex-direction:column; min-height:100vh; }
.topbar { background:var(--card-bg); border-bottom:1px solid var(--card-border); padding:0 32px; height:64px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:50; }
.topbar-title { font-family:'Syne',sans-serif; font-size:18px; font-weight:700; }
.topbar-right { display:flex; align-items:center; gap:10px; }
.btn { display:inline-flex; align-items:center; gap:6px; padding:8px 16px; border-radius:8px; font-size:13px; font-weight:500; cursor:pointer; border:none; transition:all 0.15s; font-family:'Outfit',sans-serif; }
.btn-primary { background:var(--navy); color:#fff; }
.btn-primary:hover { background:var(--navy-light); }
.btn-ghost { background:transparent; color:var(--mid-text); border:1px solid var(--card-border); }
.btn-ghost:hover { background:var(--page-bg); }
.btn-sm { padding:5px 10px; font-size:12px; }

/* Content */
.content { padding:28px 32px; flex:1; }

/* Toolbar */
.toolbar { display:flex; align-items:center; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
.search-wrap { position:relative; flex:1; min-width:200px; max-width:340px; }
.search-input { width:100%; padding:9px 12px 9px 36px; border:1px solid var(--card-border); border-radius:8px; font-size:13px; font-family:'Outfit',sans-serif; background:var(--card-bg); outline:none; transition:border-color 0.15s; }
.search-input:focus { border-color:var(--accent); }
.search-icon { position:absolute; left:11px; top:50%; transform:translateY(-50%); font-size:14px; color:var(--mid-text); pointer-events:none; }
.filter-select { padding:9px 12px; border:1px solid var(--card-border); border-radius:8px; font-size:13px; font-family:'Outfit',sans-serif; background:var(--card-bg); outline:none; cursor:pointer; color:var(--dark-text); }
.filter-select:focus { border-color:var(--accent); }
.results-count { font-size:13px; color:var(--mid-text); margin-left:auto; }

/* Table */
.table-wrap { background:var(--card-bg); border:1px solid var(--card-border); border-radius:12px; overflow:hidden; }
.change-table { width:100%; border-collapse:collapse; }
.change-table th { text-align:left; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.5px; color:var(--mid-text); padding:12px 18px; background:#f8fafc; border-bottom:1px solid var(--card-border); white-space:nowrap; }
.change-table td { padding:14px 18px; border-bottom:1px solid #f5f7fa; vertical-align:top; }
.change-table tr:last-child td { border-bottom:none; }
.change-table tbody tr { cursor:pointer; transition:background 0.1s; }
.change-table tbody tr:hover td { background:#fafcff; }
.change-table tbody tr.expanded td { background:#f5f9ff; }

/* Type badge */
.change-type-badge { display:inline-flex; align-items:center; padding:3px 9px; border-radius:6px; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.3px; white-space:nowrap; }
.ct-address    { background:#f0f8ff; color:#1a6baa; }
.ct-vehicle    { background:#fff8e8; color:#b06000; }
.ct-driver     { background:#edfaf4; color:#1a7a50; }
.ct-home       { background:#fff0e0; color:#a05c10; }
.ct-condo      { background:#f0e8ff; color:#6a2aaa; }
.ct-rental     { background:#e8f8ff; color:#0a6a8a; }
.ct-cancel     { background:#fff0f0; color:var(--red); }
.ct-other      { background:#f0f4f8; color:var(--mid-text); }

/* Policy type */
.policy-type-dot { display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:5px; }
.dot-auto       { background:var(--blue); }
.dot-home       { background:var(--accent); }
.dot-commercial { background:#9b59b6; }
.dot-other      { background:var(--mid-text); }

/* Expand row */
.expand-row { display:none; }
.expand-row.open { display:table-row; }
.expand-cell { padding:0 !important; border-bottom:1px solid var(--card-border) !important; }
.expand-inner { padding:16px 18px 20px 50px; background:#f8fbff; border-top:1px solid #e8f0f8; }
.expand-label { font-size:11px; color:var(--mid-text); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px; }
.expand-text { font-size:14px; color:var(--dark-text); line-height:1.6; }

/* Pagination */
.pagination { display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-top:1px solid var(--card-border); }
.page-info { font-size:13px; color:var(--mid-text); }
.page-btns { display:flex; gap:6px; }
.page-btn { padding:6px 12px; border-radius:6px; border:1px solid var(--card-border); background:var(--card-bg); color:var(--mid-text); font-size:13px; cursor:pointer; font-family:'Outfit',sans-serif; transition:all 0.12s; }
.page-btn:hover:not(:disabled) { background:var(--navy); color:#fff; border-color:var(--navy); }
.page-btn.active { background:var(--navy); color:#fff; border-color:var(--navy); }
.page-btn:disabled { opacity:0.4; cursor:not-allowed; }

/* Modal */
.modal-overlay { position:fixed; inset:0; background:rgba(13,27,42,0.6); backdrop-filter:blur(4px); z-index:200; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity 0.2s; }
.modal-overlay.open { opacity:1; pointer-events:all; }
.modal { background:var(--card-bg); border-radius:16px; width:580px; max-width:95vw; max-height:90vh; overflow-y:auto; transform:translateY(12px); transition:transform 0.2s; box-shadow:0 24px 64px rgba(0,0,0,0.2); }
.modal-overlay.open .modal { transform:none; }
.modal-header { padding:24px 24px 16px; border-bottom:1px solid var(--card-border); display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; background:var(--card-bg); z-index:1; }
.modal-title { font-family:'Syne',sans-serif; font-size:18px; font-weight:700; }
.modal-close { background:none; border:none; font-size:20px; cursor:pointer; color:var(--mid-text); padding:4px; border-radius:4px; }
.modal-close:hover { background:var(--page-bg); }
.modal-body { padding:24px; }
.modal-footer { padding:16px 24px; border-top:1px solid var(--card-border); display:flex; justify-content:flex-end; gap:10px; }
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.form-group { display:flex; flex-direction:column; gap:6px; }
.form-group.full { grid-column:1/-1; }
.form-label { font-size:12px; font-weight:500; color:var(--mid-text); }
.form-label .required { color:var(--red); margin-left:2px; }
.form-input,.form-select,.form-textarea { padding:9px 12px; border:1px solid var(--card-border); border-radius:8px; font-size:14px; font-family:'Outfit',sans-serif; color:var(--dark-text); background:#fff; outline:none; transition:border-color 0.15s; width:100%; }
.form-input:focus,.form-select:focus,.form-textarea:focus { border-color:var(--accent); }
.form-textarea { resize:vertical; min-height:80px; }
.form-hint { font-size:11px; color:var(--mid-text); }
.form-error { color:var(--red); font-size:12px; }

/* Config */
#config-screen { position:fixed; inset:0; background:var(--navy); display:flex; align-items:center; justify-content:center; z-index:9999; }
.config-card { background:var(--navy-mid); border:1px solid var(--border); border-radius:16px; padding:40px; width:440px; max-width:90vw; }
.config-logo { font-family:'Syne',sans-serif; font-size:24px; font-weight:800; color:var(--text-1); margin-bottom:6px; }
.config-logo span { color:var(--accent); }
.config-sub { font-size:13px; color:var(--text-3); margin-bottom:28px; }
.config-field { margin-bottom:16px; }
.config-label { font-size:12px; color:var(--text-2); margin-bottom:6px; font-weight:500; display:block; }
.config-input { width:100%; background:var(--navy); border:1px solid var(--border); border-radius:8px; padding:10px 14px; color:var(--text-1); font-size:13px; font-family:'Outfit',sans-serif; outline:none; transition:border-color 0.15s; }
.config-input:focus { border-color:var(--accent); }
.config-hint { font-size:11px; color:var(--text-3); margin-top:4px; }
.config-btn { width:100%; padding:12px; background:var(--accent); color:var(--navy); border:none; border-radius:8px; font-size:14px; font-weight:700; font-family:'Syne',sans-serif; cursor:pointer; margin-top:8px; transition:background 0.15s; }
.config-btn:hover { background:var(--accent-dim); }
.config-error { color:#ff7070; font-size:12px; margin-top:10px; display:none; }

/* Misc */
.spinner { display:inline-block; width:18px; height:18px; border:2px solid var(--card-border); border-top-color:var(--accent); border-radius:50%; animation:spin 0.7s linear infinite; vertical-align:middle; }
@keyframes spin { to { transform:rotate(360deg); } }
.loading-row td { text-align:center; padding:48px; color:var(--mid-text); }
.empty-row td { text-align:center; padding:56px; color:var(--mid-text); }
.empty-icon { font-size:36px; opacity:0.25; display:block; margin-bottom:10px; }
.toast { position:fixed; bottom:24px; right:24px; z-index:999; background:var(--navy); color:var(--text-1); padding:12px 20px; border-radius:10px; font-size:14px; font-weight:500; box-shadow:0 8px 32px rgba(0,0,0,0.2); transform:translateY(80px); opacity:0; transition:all 0.25s; }
.toast.show { transform:none; opacity:1; }
.toast.success { border-left:3px solid var(--green); }
.toast.error   { border-left:3px solid var(--red); }

@media (max-width:900px) {
  .sidebar { width:60px; }
  .sidebar-logo .logo-sub,.nav-item .nav-label,.nav-section-label,.user-name,.user-role { display:none; }
  .main { margin-left:60px; }
  .content { padding:16px; }
  .form-grid { grid-template-columns:1fr; }
}
</style>
</head>
<body>

<!-- Config -->
<div id="config-screen">
  <div class="config-card">
    <div class="config-logo">AMS<span>·</span></div>
    <div class="config-sub" data-i18n="config_sub">请输入您的 Supabase 连接信息</div>
    <div class="config-field">
      <label class="config-label" data-i18n="cfg_url_label">Project URL</label>
      <input class="config-input" id="cfg-url" type="text" placeholder="https://xxxxxxxxxx.supabase.co">
      <div class="config-hint" data-i18n="config_hint_url">Supabase > Project Settings > API</div>
    </div>
    <div class="config-field">
      <label class="config-label" data-i18n="cfg_key_label">Anon Public Key</label>
      <input class="config-input" id="cfg-key" type="password" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...">
    </div>
    <button class="config-btn" data-i18n="cfg_connect" onclick="connectSupabase()">连接并进入系统</button>
    <div class="config-error" id="cfg-error"></div>
  </div>
</div>

<!-- Sidebar -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-mark">AMS<span>·</span></div>
    <div class="logo-sub">Insurance Manager</div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-section-label" data-i18n="nav_main">主菜单</div>
    <a class="nav-item" href="ams_dashboard.html"><span class="nav-icon">⊞</span><span class="nav-label" data-i18n="nav_dashboard">仪表盘</span></a>
    <a class="nav-item" href="ams_clients.html"><span class="nav-icon">👤</span><span class="nav-label" data-i18n="nav_clients">客户管理</span></a>
    <a class="nav-item" href="ams_policies.html"><span class="nav-icon">📋</span><span class="nav-label" data-i18n="nav_policies">保单管理</span></a>
    <a class="nav-item" href="ams_tasks.html"><span class="nav-icon">✓</span><span class="nav-label" data-i18n="nav_tasks">待办任务</span></a>
    <div class="nav-section-label" style="margin-top:16px;" data-i18n="nav_business">业务</div>
    <a class="nav-item" href="ams_quotes.html"><span class="nav-icon">💲</span><span class="nav-label" data-i18n="nav_quotes">新客户报价</span></a>
    <a class="nav-item" href="ams_import_quote.html"><span class="nav-icon">📥</span><span class="nav-label" data-i18n="nav_import">报价导入</span></a>
    <a class="nav-item" href="ams_renewal.html"><span class="nav-icon">🔄</span><span class="nav-label" data-i18n="nav_renewal">续保对比</span></a>
    <div class="nav-section-label" style="margin-top:16px;" data-i18n="nav_records">记录</div>
    <a class="nav-item active" href="#"><span class="nav-icon">📝</span><span class="nav-label" data-i18n="nav_changes">变更记录</span></a>
    <a class="nav-item" href="ams_reports.html"><span class="nav-icon">📊</span><span class="nav-label" data-i18n="nav_reports">报表</span></a>
  </nav>
  <div class="sidebar-footer">
    <div class="user-chip">
      <div class="user-avatar">我</div>
      <div><div class="user-name" data-i18n="user_name">独立经纪人</div><div class="user-role">Administrator</div></div>
    </div>
  </div>
</aside>

<!-- Main -->
<div class="main">
  <header class="topbar">
    <div class="topbar-title" data-i18n="page_changes">变更记录</div>
    <div class="topbar-right">
      <button class="btn btn-ghost" data-i18n="btn_refresh" onclick="loadChanges()">↻ 刷新</button>
      <button class="btn btn-primary" data-i18n="btn_new_change" onclick="openNewChangeModal()">＋ 新增变更</button>
    </div>
  </header>

  <div class="content">
    <div class="toolbar">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input class="search-input" id="search-input" type="text"
               placeholder="搜索客户、保单号、变更摘要…" data-i18n="search_changes_placeholder" data-i18n-target="placeholder" oninput="applyFilters()">
      </div>
      <select class="filter-select" id="type-filter" onchange="applyFilters()">
        <option value="all" data-i18n="filter_all_types">全部类型</option>
        <option value="address change" data-i18n="ct_address_change">地址变更</option>
        <option value="vehicle add" data-i18n="ct_vehicle_add">新增车辆</option>
        <option value="vehicle delete" data-i18n="ct_vehicle_delete">删除车辆</option>
        <option value="vehicle substitute" data-i18n="ct_vehicle_substitute">替换车辆</option>
        <option value="add driver" data-i18n="ct_add_driver">新增驾驶员</option>
        <option value="add home" data-i18n="ct_add_home">新增家财险</option>
        <option value="add condo" data-i18n="ct_add_condo">新增公寓险</option>
        <option value="add rental" data-i18n="ct_add_rental">新增租赁险</option>
        <option value="cancellation" data-i18n="ct_cancellation">取消保单</option>
        <option value="other" data-i18n="ct_other">其他</option>
      </select>
      <select class="filter-select" id="date-filter" onchange="applyFilters()">
        <option value="all" data-i18n="filter_all_time">全部时间</option>
        <option value="7" data-i18n="filter_last_7d">最近 7 天</option>
        <option value="30" data-i18n="filter_last_30d">最近 30 天</option>
        <option value="90" data-i18n="filter_last_90d">最近 90 天</option>
        <option value="365" data-i18n="filter_last_year">最近一年</option>
      </select>
      <span class="results-count" id="results-count"></span>
    </div>

    <div class="table-wrap">
      <table class="change-table">
        <thead>
          <tr>
            <th style="width:36px"></th>
            <th data-i18n="th_change_date">变更日期</th>
            <th data-i18n="th_client">客户</th>
            <th data-i18n="th_change_type">变更类型</th>
            <th data-i18n="th_policy">保单</th>
            <th data-i18n="th_change_summary">变更摘要</th>
          </tr>
        </thead>
        <tbody id="change-tbody">
          <tr class="loading-row"><td colspan="6"><span class="spinner"></span> 加载中…</td></tr>
        </tbody>
      </table>
      <div class="pagination" id="pagination" style="display:none">
        <span class="page-info" id="page-info"></span>
        <div class="page-btns" id="page-btns"></div>
      </div>
    </div>
  </div>
</div>

<!-- New Change Modal -->
<div class="modal-overlay" id="change-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" data-i18n="modal_new_change">新增变更记录</div>
      <button class="modal-close" onclick="safeCloseModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">客户编码<span class="required">*</span></label>
          <input class="form-input" id="f-code" type="text" placeholder="ABCD01"
                 maxlength="6" style="text-transform:uppercase" oninput="lookupClient()">
          <div id="client-result" style="font-size:12px;min-height:16px;margin-top:2px"></div>
          <span class="form-error" id="f-code-err"></span>
        </div>
        <div class="form-group">
          <label class="form-label">保单<span class="required">*</span></label>
          <select class="form-select" id="f-policy-id">
            <option value="">— 先输入客户编码 —</option>
          </select>
          <span class="form-error" id="f-policy-err"></span>
        </div>
        <div class="form-group">
          <label class="form-label">变更类型<span class="required">*</span></label>
          <select class="form-select" id="f-change-type">
            <option value="address change">地址变更</option>
            <option value="vehicle add">新增车辆</option>
            <option value="vehicle delete">删除车辆</option>
            <option value="vehicle substitute">替换车辆</option>
            <option value="add driver">新增驾驶员</option>
            <option value="add home">新增家财险</option>
            <option value="add condo">新增公寓险</option>
            <option value="add rental">新增租赁险</option>
            <option value="cancellation">取消保单</option>
            <option value="other">其他</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">变更日期<span class="required">*</span></label>
          <input class="form-input" id="f-change-date" type="date">
        </div>
        <div class="form-group full">
          <label class="form-label">变更摘要<span class="required">*</span></label>
          <textarea class="form-textarea" id="f-summary"
                    placeholder="简要描述本次变更，如：将 primary driver 从张伟更改为李娜，保费调整 +$80"></textarea>
          <span class="form-error" id="f-summary-err"></span>
        </div>
        <div class="form-group full">
          <label class="form-label">详细说明（选填）</label>
          <textarea class="form-textarea" id="f-details"
                    placeholder="可记录变更前后的具体数值对比，或任何注意事项…"></textarea>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="safeCloseModal()">取消</button>
      <button class="btn btn-primary" id="save-btn" onclick="saveChange()">保存变更</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let db = null;
let allChanges = [];
let filtered   = [];
const PAGE_SIZE = 30;
let currentPage = 1;
let lookupTimer = null;
let expandedRow = null;

const CT_ZH = {
  'address change':'地址变更','vehicle add':'新增车辆','vehicle delete':'删除车辆',
  'vehicle substitute':'替换车辆','add driver':'新增驾驶员','add home':'新增家财险',
  'add condo':'新增公寓险','add rental':'新增租赁险','cancellation':'取消保单','other':'其他'
};
const CT_CLASS = {
  'address change':'ct-address','vehicle add':'ct-vehicle','vehicle delete':'ct-vehicle',
  'vehicle substitute':'ct-vehicle','add driver':'ct-driver','add home':'ct-home',
  'add condo':'ct-condo','add rental':'ct-rental','cancellation':'ct-cancel','other':'ct-other'
};
const TYPE_LABEL = { auto:'车险', home:'家财险', commercial:'商业险', other:'其他' };

// ── Connect ──
async function connectSupabase() {
  const url = document.getElementById('cfg-url').value.trim();
  const key = document.getElementById('cfg-key').value.trim();
  const errEl = document.getElementById('cfg-error');
  errEl.style.display = 'none';
  if (!url || !key) { errEl.textContent = '请填写配置'; errEl.style.display = 'block'; return; }
  try {
    db = window.supabase.createClient(url, key);
    const { error } = await db.from('policy_changes').select('id').limit(1);
    if (error) throw error;
    window.AMSBootstrap.storeCredentials(url, key);
    document.getElementById('config-screen').style.display = 'none';
    loadChanges();
  } catch(e) { errEl.textContent = '连接失败：' + e.message; errEl.style.display = 'block'; }
}
(async function autoConnect() {
  const creds = await window.AMSBootstrap.getCredentials();
  if (creds?.url && creds?.key) {
    db = window.supabase.createClient(creds.url, creds.key);
    window.AMSBootstrap.storeCredentials(creds.url, creds.key);
    document.getElementById('config-screen').style.display = 'none';
    loadChanges();
  }
})();

// ── Load ──
async function loadChanges() {
  document.getElementById('change-tbody').innerHTML =
    '<tr class="loading-row"><td colspan="6"><span class="spinner"></span> 加载中…</td></tr>';
  try {
    const { data, error } = await db
      .from('policy_changes')
      .select('*, clients(full_name), policies(policy_number, policy_type, insurer)')
      .order('change_date', { ascending: false })
      .order('created_at', { ascending: false });
    if (error) throw error;
    allChanges = data || [];
    applyFilters();
  } catch(e) {
    document.getElementById('change-tbody').innerHTML =
      `<tr class="empty-row"><td colspan="6"><span class="empty-icon">⚠️</span>${esc(e.message)}</td></tr>`;
  }
}

// ── Filters ──
function applyFilters() {
  const q      = document.getElementById('search-input').value.toLowerCase();
  const typeF  = document.getElementById('type-filter').value;
  const dateF  = document.getElementById('date-filter').value;
  const cutoff = dateF !== 'all'
    ? new Date(Date.now() - parseInt(dateF) * 86400000).toISOString().split('T')[0]
    : null;

  filtered = allChanges.filter(c => {
    if (typeF !== 'all' && c.change_type !== typeF) return false;
    if (cutoff && c.change_date < cutoff) return false;
    if (q) {
      const hay = [c.clients?.full_name, c.customer_code, c.policies?.policy_number,
                   c.policies?.insurer, c.summary, CT_ZH[c.change_type]].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  document.getElementById('results-count').textContent = `共 ${filtered.length} 条记录`;
  currentPage = 1;
  renderTable();
}

// ── Render ──
function renderTable() {
  const tbody  = document.getElementById('change-tbody');
  const total  = filtered.length;
  const pages  = Math.ceil(total / PAGE_SIZE);
  const start  = (currentPage - 1) * PAGE_SIZE;
  const slice  = filtered.slice(start, start + PAGE_SIZE);

  if (total === 0) {
    tbody.innerHTML = `<tr class="empty-row"><td colspan="6"><span class="empty-icon">📝</span>暂无变更记录</td></tr>`;
    document.getElementById('pagination').style.display = 'none';
    return;
  }

  tbody.innerHTML = slice.map((c, idx) => {
    const rowId   = `row-${start + idx}`;
    const dotClass= 'dot-' + (c.policies?.policy_type || 'other');
    const pLabel  = TYPE_LABEL[c.policies?.policy_type] || '—';
    const pNum    = c.policies?.policy_number || '—';
    const pInsurer= c.policies?.insurer || '';
    const hasDetail = c.details && c.details.trim();
    return `
      <tr id="${rowId}" onclick="${hasDetail ? `toggleExpand('${rowId}','${rowId}-expand')` : ''}">
        <td style="padding-left:18px;color:var(--mid-text);font-size:14px">
          ${hasDetail ? '▸' : ''}
        </td>
        <td style="font-size:13px;white-space:nowrap;color:var(--mid-text)">${c.change_date}</td>
        <td>
          <div style="font-size:14px;font-weight:500">${esc(c.clients?.full_name || c.customer_code)}</div>
          <div style="font-size:11px;color:var(--mid-text);font-family:monospace">${esc(c.customer_code)}</div>
        </td>
        <td><span class="change-type-badge ${CT_CLASS[c.change_type]||'ct-other'}">${CT_ZH[c.change_type]||c.change_type}</span></td>
        <td>
          <div style="font-size:13px;font-weight:500">
            <span class="policy-type-dot ${dotClass}"></span>${esc(pNum)}
          </div>
          <div style="font-size:11px;color:var(--mid-text)">${esc(pInsurer)} ${pLabel !== '—' ? '· '+pLabel : ''}</div>
        </td>
        <td style="font-size:13px;max-width:300px">${esc(c.summary)}</td>
      </tr>
      ${hasDetail ? `
      <tr class="expand-row" id="${rowId}-expand">
        <td class="expand-cell" colspan="6">
          <div class="expand-inner">
            <div class="expand-label">详细说明</div>
            <div class="expand-text">${esc(c.details)}</div>
          </div>
        </td>
      </tr>` : ''}`;
  }).join('');

  // Pagination
  const pagEl = document.getElementById('pagination');
  if (pages <= 1) { pagEl.style.display = 'none'; return; }
  pagEl.style.display = 'flex';
  document.getElementById('page-info').textContent =
    `第 ${start + 1}–${Math.min(start + PAGE_SIZE, total)} 条，共 ${total} 条`;

  const btns = document.getElementById('page-btns');
  let html = `<button class="page-btn" ${currentPage===1?'disabled':''} onclick="goPage(${currentPage-1})">‹ 上一页</button>`;
  const range = getPageRange(currentPage, pages);
  range.forEach(p => {
    if (p === '...') html += `<span style="padding:6px 4px;color:var(--mid-text)">…</span>`;
    else html += `<button class="page-btn ${p===currentPage?'active':''}" onclick="goPage(${p})">${p}</button>`;
  });
  html += `<button class="page-btn" ${currentPage===pages?'disabled':''} onclick="goPage(${currentPage+1})">下一页 ›</button>`;
  btns.innerHTML = html;
}

function getPageRange(cur, total) {
  if (total <= 7) return Array.from({length:total},(_,i)=>i+1);
  if (cur <= 4) return [1,2,3,4,5,'...',total];
  if (cur >= total-3) return [1,'...',total-4,total-3,total-2,total-1,total];
  return [1,'...',cur-1,cur,cur+1,'...',total];
}
function goPage(p) { currentPage = p; renderTable(); window.scrollTo(0,0); }

function toggleExpand(rowId, expandId) {
  const row = document.getElementById(rowId);
  const exp = document.getElementById(expandId);
  if (!exp) return;
  const isOpen = exp.classList.contains('open');
  // close any open rows and reset their icons
  document.querySelectorAll('.expand-row.open').forEach(r => {
    r.classList.remove('open');
    const parentRow = document.getElementById(r.id.replace(/-expand$/, ''));
    if (parentRow && parentRow.cells[0]) parentRow.cells[0].textContent = '▸';
  });
  document.querySelectorAll('.change-table tbody tr.expanded').forEach(r => r.classList.remove('expanded'));
  if (!isOpen) {
    exp.classList.add('open');
    row.classList.add('expanded');
    row.cells[0].textContent = '▾';
  }
}

// ── New Change Modal ──
function openNewChangeModal() {
  clearForm();
  document.getElementById('f-change-date').value = new Date().toISOString().split('T')[0];
  document.getElementById('change-modal').classList.add('open');
}
function closeModal() { document.getElementById('change-modal').classList.remove('open'); }
function safeCloseModal() {
  if (!confirm('确定要关闭吗？未保存的内容将丢失。')) return;
  closeModal();
}

function clearForm() {
  ['f-code','f-summary','f-details'].forEach(id => { const e = document.getElementById(id); if(e) e.value=''; });
  document.getElementById('f-change-type').value = 'address change';
  document.getElementById('f-policy-id').innerHTML = '<option value="">— 先输入客户编码 —</option>';
  document.getElementById('client-result').textContent = '';
  ['f-code-err','f-policy-err','f-summary-err'].forEach(id => { const e = document.getElementById(id); if(e) e.textContent=''; });
}

async function lookupClient() {
  const code   = document.getElementById('f-code').value.trim().toUpperCase();
  const result = document.getElementById('client-result');
  const pSel   = document.getElementById('f-policy-id');
  clearTimeout(lookupTimer);
  pSel.innerHTML = '<option value="">— 先输入客户编码 —</option>';
  if (!/^[A-Z]{4}[0-9]{2}$/.test(code)) { result.textContent = ''; return; }
  lookupTimer = setTimeout(async () => {
    try {
      const [clientRes, policyRes] = await Promise.all([
        db.from('clients').select('full_name').eq('customer_code', code).single(),
        db.from('policies').select('id,policy_number,policy_type,insurer')
          .eq('customer_code', code).in('status',['active','pending_renewal'])
      ]);
      if (!clientRes.data) { result.textContent = '找不到此客户编码'; result.style.color = 'var(--red)'; return; }
      result.textContent = '✓ ' + clientRes.data.full_name;
      result.style.color = 'var(--green)';
      const policies = policyRes.data || [];
      if (policies.length) {
        pSel.innerHTML = policies.map(p =>
          `<option value="${p.id}">${p.policy_number} · ${TYPE_LABEL[p.policy_type]||p.policy_type} · ${p.insurer}</option>`
        ).join('');
      } else {
        pSel.innerHTML = '<option value="">该客户暂无有效保单</option>';
      }
    } catch { result.textContent = '查询失败'; result.style.color = 'var(--red)'; }
  }, 400);
}

async function saveChange() {
  let valid = true;
  ['f-code-err','f-policy-err','f-summary-err'].forEach(id => { document.getElementById(id).textContent = ''; });
  const code    = document.getElementById('f-code').value.trim().toUpperCase();
  const polId   = document.getElementById('f-policy-id').value;
  const summary = document.getElementById('f-summary').value.trim();
  if (!/^[A-Z]{4}[0-9]{2}$/.test(code)) { document.getElementById('f-code-err').textContent = '请输入有效客户编码'; valid = false; }
  if (!polId)   { document.getElementById('f-policy-err').textContent = '请选择关联保单'; valid = false; }
  if (!summary) { document.getElementById('f-summary-err').textContent = '变更摘要为必填项'; valid = false; }
  if (!valid) return;

  const btn = document.getElementById('save-btn');
  btn.textContent = '保存中…'; btn.disabled = true;
  try {
    const { error } = await db.from('policy_changes').insert({
      customer_code: code,
      policy_id:     polId,
      change_type:   document.getElementById('f-change-type').value,
      change_date:   document.getElementById('f-change-date').value,
      summary:       summary,
      details:       document.getElementById('f-details').value.trim() || null,
    });
    if (error) throw error;
    closeModal();
    showToast('变更记录已保存 ✓', 'success');
    await loadChanges();
  } catch(e) { showToast('保存失败：' + e.message, 'error'); }
  finally { btn.textContent = '保存变更'; btn.disabled = false; }
}

function esc(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function showToast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 3000);
}
document.getElementById('change-modal').addEventListener('click', function(e) { if(e.target===this) safeCloseModal(); });
</script>
<script src="ams_i18n.js"></script>
</body>
</html>
