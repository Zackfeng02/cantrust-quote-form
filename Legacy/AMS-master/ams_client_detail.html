<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMS · Client Detail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="ams_bootstrap.js"></script>
<style>
/* ── Reset & Variables ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --navy:       #0d1b2a;
  --navy-mid:   #152336;
  --navy-light: #1e3450;
  --navy-hover: #243d5e;
  --accent:     #e8a020;
  --accent-dim: #c4851a;
  --red:        #e05252;
  --green:      #3fc98b;
  --blue:       #4a9edd;
  --text-1:     #f0f4f8;
  --text-2:     #a8bcd0;
  --text-3:     #607a93;
  --border:     rgba(255,255,255,0.07);
  --card-bg:    #ffffff;
  --page-bg:    #f0f4f8;
  --card-border:#e2e8f0;
  --dark-text:  #1a2e42;
  --mid-text:   #4a6478;
}
body { font-family: 'Outfit', sans-serif; background: var(--page-bg); color: var(--dark-text); min-height: 100vh; display: flex; overflow-x: hidden; }

/* ── Sidebar ── */
.sidebar { width: 240px; min-height: 100vh; background: var(--navy); display: flex; flex-direction: column; position: fixed; left: 0; top: 0; bottom: 0; z-index: 100; border-right: 1px solid var(--border); }
.sidebar-logo { padding: 28px 24px 24px; border-bottom: 1px solid var(--border); }
.logo-mark { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 20px; color: var(--text-1); letter-spacing: -0.5px; }
.logo-mark span { color: var(--accent); }
.logo-sub { font-size: 11px; color: var(--text-3); margin-top: 3px; letter-spacing: 0.5px; text-transform: uppercase; }
.sidebar-nav { flex: 1; padding: 16px 12px; }
.nav-section-label { font-size: 10px; color: var(--text-3); text-transform: uppercase; letter-spacing: 1px; padding: 8px 12px 4px; margin-top: 8px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; color: var(--text-2); font-size: 14px; font-weight: 400; cursor: pointer; transition: all 0.15s; margin-bottom: 2px; text-decoration: none; }
.nav-item:hover { background: var(--navy-hover); color: var(--text-1); }
.nav-item.active { background: var(--navy-light); color: var(--text-1); font-weight: 500; }
.nav-item.active .nav-icon { color: var(--accent); }
.nav-icon { font-size: 16px; width: 20px; text-align: center; }
.sidebar-footer { padding: 16px 12px; border-top: 1px solid var(--border); }
.user-chip { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; background: var(--navy-mid); }
.user-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: var(--navy); flex-shrink: 0; }
.user-name { font-size: 13px; color: var(--text-1); font-weight: 500; }
.user-role { font-size: 11px; color: var(--text-3); }

/* ── Hamburger (mobile) ── */
.hamburger { display: none; background: none; border: none; color: var(--text-1); font-size: 22px; cursor: pointer; padding: 8px; }
.sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 99; }
.sidebar-overlay.open { display: block; }

/* ── Main ── */
.main { margin-left: 240px; flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
.topbar { background: var(--card-bg); border-bottom: 1px solid var(--card-border); padding: 0 32px; height: 64px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
.topbar-left { display: flex; align-items: center; gap: 12px; }
.topbar-right { display: flex; align-items: center; gap: 8px; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; transition: all 0.15s; font-family: 'Outfit', sans-serif; }
.btn-primary { background: var(--navy); color: #fff; }
.btn-primary:hover { background: var(--navy-light); }
.btn-ghost { background: transparent; color: var(--mid-text); border: 1px solid var(--card-border); }
.btn-ghost:hover { background: var(--page-bg); }
.btn-danger { background: #fff0f0; color: var(--red); border: 1px solid #ffd5d5; }
.btn-danger:hover { background: #ffe0e0; }
.btn-sm { padding: 5px 10px; font-size: 12px; }

/* ── Topbar detail ── */
.topbar-back { font-size: 20px; background: none; border: none; cursor: pointer; color: var(--mid-text); padding: 4px 8px; border-radius: 6px; display: flex; align-items: center; gap: 6px; font-size: 13px; font-family: 'Outfit', sans-serif; }
.topbar-back:hover { background: var(--page-bg); color: var(--dark-text); }
.topbar-client-name { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 700; }
.topbar-code { font-size: 12px; color: var(--mid-text); font-family: monospace; margin-left: 8px; }

/* ── Detail Layout ── */
.detail-layout { display: grid; grid-template-columns: 1fr 320px; gap: 24px; padding: 24px 32px; align-items: start; }
.detail-main { display: flex; flex-direction: column; gap: 20px; }
.detail-panel { display: flex; flex-direction: column; gap: 20px; }

/* ── Cards ── */
.card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 20px; }
.card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.card-title { font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; color: var(--dark-text); }
.card-title-icon { margin-right: 6px; }

/* ── Field Grid ── */
.field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field-item { display: flex; flex-direction: column; gap: 3px; }
.field-item.full { grid-column: 1 / -1; }
.field-label { font-size: 11px; color: var(--mid-text); text-transform: uppercase; letter-spacing: 0.4px; }
.field-value { font-size: 14px; color: var(--dark-text); }
.field-value a { color: var(--blue); text-decoration: none; }
.field-value a:hover { text-decoration: underline; }
.field-value.mono { font-family: monospace; font-size: 13px; }
.field-empty { font-size: 13px; color: var(--mid-text); font-style: italic; }

/* ── Tags ── */
.tag-chip { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; background: #f0f4f8; color: var(--mid-text); border: 1px solid var(--card-border); margin: 2px; }

/* ── Contacts ── */
.contact-card { background: #f8fafc; border: 1px solid var(--card-border); border-radius: 8px; padding: 14px; margin-bottom: 10px; }
.contact-card:last-child { margin-bottom: 0; }
.contact-card-header { display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
.contact-name { font-size: 14px; font-weight: 500; color: var(--dark-text); }
.contact-body { margin-top: 12px; }
.contact-collapsed .contact-body { display: none; }

/* ── Policy Cards ── */
.policy-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 16px; margin-bottom: 10px; position: relative; overflow: hidden; }
.policy-card:last-child { margin-bottom: 0; }
.policy-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
.policy-card.auto::before       { background: var(--blue); }
.policy-card.home::before       { background: var(--accent); }
.policy-card.commercial::before { background: #9b59b6; }
.policy-card.other::before      { background: var(--mid-text); }
.policy-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.policy-type-badge { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 6px; text-transform: uppercase; }
.policy-type-badge.auto       { background: #e8f4ff; color: #1a6baa; }
.policy-type-badge.home       { background: #fff0e0; color: #a05c10; }
.policy-type-badge.commercial { background: #f0e8ff; color: #6a2aaa; }
.policy-type-badge.other      { background: #f0f4f8; color: #607a93; }
.policy-status-badge { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 6px; }
.status-active          { background: #edfaf4; color: #1a7a50; }
.status-pending_renewal { background: #fff8e8; color: #b06000; }
.status-renewed         { background: #e8f4ff; color: #1a6baa; }
.status-cancelled       { background: #fff0f0; color: var(--red); }
.status-expired         { background: #f0f4f8; color: var(--mid-text); }
.policy-number { font-size: 13px; font-weight: 600; color: var(--dark-text); }
.policy-insurer { font-size: 12px; color: var(--mid-text); margin-top: 2px; }
.policy-dates { display: flex; gap: 20px; margin-top: 8px; }
.policy-date-label { font-size: 11px; color: var(--mid-text); }
.policy-date-value { font-size: 13px; color: var(--dark-text); font-weight: 500; }

/* ── Panel Items ── */
.panel-item { display: flex; flex-direction: column; gap: 3px; padding: 10px 0; border-bottom: 1px solid #f5f7fa; }
.panel-item:last-child { border-bottom: none; }
.panel-item-title { font-size: 13px; font-weight: 500; color: var(--dark-text); }
.panel-item-sub { font-size: 12px; color: var(--mid-text); }
.panel-item-sub a { color: var(--blue); text-decoration: none; }
.panel-item-sub a:hover { text-decoration: underline; }
.days-chip { display: inline-block; padding: 2px 7px; border-radius: 20px; font-size: 11px; font-weight: 600; }
.days-urgent  { background: #fff0f0; color: var(--red); border: 1px solid #ffd5d5; }
.days-warning { background: #fff8e8; color: #b06000; border: 1px solid #ffd580; }

.policy-card-link { text-decoration: none; color: inherit; display: block; }
.policy-card-link:hover .policy-card { background: #f8faff; border-color: var(--blue); }

/* ── Not Found ── */
.not-found { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; gap: 16px; color: var(--mid-text); }
.not-found-icon { font-size: 48px; opacity: 0.2; }

/* ── Loading ── */
.spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid var(--card-border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-center { display: flex; align-items: center; justify-content: center; padding: 60px; gap: 10px; color: var(--mid-text); }

/* ── Modals ── */
.modal-overlay { position: fixed; inset: 0; background: rgba(13,27,42,0.6); backdrop-filter: blur(4px); z-index: 200; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal { background: var(--card-bg); border-radius: 16px; width: 620px; max-width: 96vw; max-height: 90vh; overflow-y: auto; transform: translateY(12px); transition: transform 0.2s; box-shadow: 0 24px 64px rgba(0,0,0,0.2); }
.modal-overlay.open .modal { transform: none; }
.modal-header { padding: 24px 24px 16px; border-bottom: 1px solid var(--card-border); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: var(--card-bg); z-index: 1; }
.modal-title { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 700; }
.modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--mid-text); padding: 4px; border-radius: 4px; }
.modal-close:hover { color: var(--dark-text); background: var(--page-bg); }
.modal-body { padding: 24px; }
.modal-footer { padding: 16px 24px; border-top: 1px solid var(--card-border); display: flex; justify-content: flex-end; gap: 10px; }

/* ── Form ── */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-group.full { grid-column: 1 / -1; }
.form-label { font-size: 12px; font-weight: 500; color: var(--mid-text); }
.form-label .req { color: var(--red); margin-left: 2px; }
.form-input, .form-select, .form-textarea { padding: 9px 12px; border: 1px solid var(--card-border); border-radius: 8px; font-size: 14px; font-family: 'Outfit', sans-serif; color: var(--dark-text); background: #fff; outline: none; transition: border-color 0.15s; }
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); }
.form-textarea { resize: vertical; min-height: 80px; }
.form-hint { font-size: 11px; color: var(--mid-text); }
.form-error { color: var(--red); font-size: 12px; }

/* ── Toast ── */
.toast { position: fixed; bottom: 24px; right: 24px; z-index: 999; background: var(--navy); color: var(--text-1); padding: 12px 20px; border-radius: 10px; font-size: 14px; font-weight: 500; box-shadow: 0 8px 32px rgba(0,0,0,0.2); transform: translateY(80px); opacity: 0; transition: all 0.25s; }
.toast.show { transform: none; opacity: 1; }
.toast.success { border-left: 3px solid var(--green); }
.toast.error   { border-left: 3px solid var(--red); }

/* ── Config screen ── */
#config-screen { position: fixed; inset: 0; background: var(--navy); display: flex; align-items: center; justify-content: center; z-index: 9999; }
.config-card { background: var(--navy-mid); border: 1px solid var(--border); border-radius: 16px; padding: 40px; width: 440px; max-width: 90vw; }
.config-logo { font-family: 'Syne', sans-serif; font-size: 24px; font-weight: 800; color: var(--text-1); margin-bottom: 6px; }
.config-logo span { color: var(--accent); }
.config-sub { font-size: 13px; color: var(--text-3); margin-bottom: 28px; }
.config-field { margin-bottom: 16px; }
.config-label { font-size: 12px; color: var(--text-2); margin-bottom: 6px; font-weight: 500; display: block; }
.config-input { width: 100%; background: var(--navy); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; color: var(--text-1); font-size: 13px; font-family: 'Outfit', sans-serif; outline: none; transition: border-color 0.15s; }
.config-input:focus { border-color: var(--accent); }
.config-btn { width: 100%; padding: 12px; background: var(--accent); color: var(--navy); border: none; border-radius: 8px; font-size: 14px; font-weight: 700; font-family: 'Syne', sans-serif; cursor: pointer; margin-top: 8px; }
.config-btn:hover { background: var(--accent-dim); }
.config-error { color: #ff7070; font-size: 12px; margin-top: 10px; display: none; }

/* ── Mobile ── */
@media (max-width: 900px) {
  .detail-layout { grid-template-columns: 1fr; padding: 16px; }
}
@media (max-width: 768px) {
  .sidebar { transform: translateX(-100%); transition: transform 0.25s; }
  .sidebar.open { transform: none; }
  .main { margin-left: 0; }
  .hamburger { display: block; }
  .topbar { padding: 0 16px; }
  .form-grid { grid-template-columns: 1fr; }
  .field-grid { grid-template-columns: 1fr; }
}
@media (max-width: 480px) {
  .form-grid { grid-template-columns: 1fr; }
}
</style>
</head>

<script>
let db = null;
let clientId = null;
let clientData = null;

// ── Supabase ──
(async function autoConnect() {
  const creds = await window.AMSBootstrap.getCredentials();
  if (creds?.url && creds?.key) {
    document.getElementById('cfg-url').value = creds.url;
    document.getElementById('cfg-key').value = creds.key;
    db = window.supabase.createClient(creds.url, creds.key);
    window.AMSBootstrap.storeCredentials(creds.url, creds.key);
    document.getElementById('config-screen').style.display = 'none';
    init();
  }
})();

async function connectSupabase() {
  const url = document.getElementById('cfg-url').value.trim();
  const key = document.getElementById('cfg-key').value.trim();
  const errEl = document.getElementById('cfg-error');
  errEl.style.display = 'none';
  if (!url || !key) { errEl.textContent = 'Please enter credentials'; errEl.style.display = 'block'; return; }
  try {
    db = window.supabase.createClient(url, key);
    const { error } = await db.from('clients').select('id').limit(1);
    if (error) throw error;
    window.AMSBootstrap.storeCredentials(url, key);
    document.getElementById('config-screen').style.display = 'none';
    init();
  } catch(e) { errEl.textContent = 'Connection failed: ' + e.message; errEl.style.display = 'block'; }
}

// ── Helpers ──
function esc(s) { return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function getInitials(n) { return (n||'').trim().split(/\s+/).slice(0,2).map(w=>w[0]?.toUpperCase()||'').join(''); }
function showToast(msg, type='success') { const t=document.getElementById('toast'); t.textContent=msg; t.className=`toast ${type} show`; setTimeout(()=>t.classList.remove('show'),3000); }
function daysUntil(d) { return Math.ceil((new Date(d)-new Date())/86400000); }
function goBack() { if(document.referrer.includes('ams_clients.html')) history.back(); else location.href='ams_clients.html'; }
function openSidebar()  { document.getElementById('sidebar').classList.add('open'); document.getElementById('sidebar-overlay').classList.add('open'); }
function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebar-overlay').classList.remove('open'); }

// ─────────────────────────────────────────
// Init
// ─────────────────────────────────────────
async function init() {
  const params = new URLSearchParams(location.search);
  clientId = params.get('id');
  if (!clientId) { showNotFound(); return; }
  await loadClient();
}

function showNotFound() {
  document.getElementById('page-content').innerHTML = `
    <div class="not-found">
      <div class="not-found-icon">👤</div>
      <div style="font-size:16px">Client not found</div>
      <a href="ams_clients.html" class="btn btn-ghost">← Back to Clients</a>
    </div>`;
}

// ─────────────────────────────────────────
// Task 7: Load & Display
// ─────────────────────────────────────────
async function loadClient() {
  try {
    const clientRes = await db.from('clients').select('*').eq('id', clientId).single();
    if (clientRes.error || !clientRes.data) { showNotFound(); return; }
    clientData = clientRes.data;

    const code = clientData.customer_code;
    const [polRes, renRes, tskRes] = await Promise.all([
      db.from('policies').select('*').eq('customer_code', code).order('expiry_date', { ascending: false }),
      db.from('v_renewal_dashboard').select('*').eq('customer_code', code).order('expiry_date'),
      db.from('tasks').select('*').eq('customer_code', code).not('status','in','("completed","abandoned")').order('due_date', { nullsFirst: false })
    ]);

    document.getElementById('topbar-name').textContent = clientData.full_name;
    document.getElementById('topbar-code').textContent = clientData.customer_code;
    document.getElementById('topbar-actions').style.display = '';
    document.title = `AMS · ${clientData.full_name}`;

    renderProfile(clientData, polRes.data||[], renRes.data||[], tskRes.data||[]);
  } catch(e) {
    showNotFound();
  }
}

function renderProfile(client, policies, renewals, tasks) {
  const isCorporation = client.client_type === 'corporation';
  const tags = (client.tags||[]).map(t=>`<span class="tag-chip">${esc(t)}</span>`).join('');
  const initials = getInitials(client.full_name);

  const profileHtml = `
    <div class="card">
      <div class="card-header">
        <div style="display:flex;align-items:center;gap:14px">
          <div style="width:52px;height:52px;border-radius:13px;background:${isCorporation?'#4a2d7a':'var(--navy)'};color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:20px;font-weight:700;flex-shrink:0">${esc(initials)}</div>
          <div>
            <div style="font-family:'Syne',sans-serif;font-size:20px;font-weight:700">${esc(client.full_name)}</div>
            <div style="font-size:12px;color:var(--mid-text);margin-top:2px">${esc(client.customer_code)} · ${isCorporation?'Corporation':'Individual'}</div>
            ${tags ? `<div style="margin-top:6px">${tags}</div>` : ''}
          </div>
        </div>
      </div>
      <div id="profile-display">
        <div class="field-grid">
          <div class="field-item"><div class="field-label">Phone</div><div class="field-value">${client.phone?`<a href="tel:${esc(client.phone)}">${esc(client.phone)}</a>`:'<span class="field-empty">—</span>'}</div></div>
          <div class="field-item"><div class="field-label">Email</div><div class="field-value">${client.email?`<a href="mailto:${esc(client.email)}">${esc(client.email)}</a>`:'<span class="field-empty">—</span>'}</div></div>
          <div class="field-item full"><div class="field-label">Address</div><div class="field-value">${client.address?esc(client.address):'<span class="field-empty">—</span>'}</div></div>
          <div class="field-item"><div class="field-label">Birthday</div><div class="field-value">${client.birthday?esc(client.birthday):'<span class="field-empty">—</span>'}</div></div>
          <div class="field-item"><div class="field-label">Referral Source</div><div class="field-value">${client.referral_source?esc(client.referral_source):'<span class="field-empty">—</span>'}</div></div>
          ${client.notes?`<div class="field-item full"><div class="field-label">Notes</div><div class="field-value">${esc(client.notes)}</div></div>`:''}
        </div>
        <div style="margin-top:14px;text-align:right">
          <button class="btn btn-ghost btn-sm" onclick="startEdit()">✏️ Edit Profile</button>
        </div>
      </div>
    </div>`;

  const contactHtml = `
    <div class="card">
      <div class="card-header"><div class="card-title"><span class="card-title-icon">👥</span>Contacts</div></div>
      ${renderContactCard(client.contact_1, 'contact_1', 'Contact 1')}
      ${renderContactCard(client.contact_2, 'contact_2', 'Contact 2')}
    </div>`;

  const policiesHtml = `
    <div class="card">
      <div class="card-header">
        <div class="card-title"><span class="card-title-icon">📋</span>Policies (${policies.length})</div>
        <a href="ams_policies.html?customer_code=${esc(client.customer_code)}" class="btn btn-ghost btn-sm">＋ Add Policy</a>
      </div>
      ${policies.length === 0
        ? '<p style="color:var(--mid-text);font-size:13px;font-style:italic">No policies yet. <a href="ams_policies.html?customer_code='+esc(client.customer_code)+'">Add the first policy →</a></p>'
        : policies.map(renderPolicyCard).join('')}
    </div>`;

  const panelHtml = `
    <div class="card">
      <div class="card-header"><div class="card-title">🔔 Upcoming Renewals</div></div>
      ${renewals.length === 0
        ? '<p style="color:var(--mid-text);font-size:13px;font-style:italic">No active renewals within 60 days</p>'
        : renewals.map(r => {
            const days = daysUntil(r.expiry_date);
            const cls = days <= 14 ? 'days-urgent' : 'days-warning';
            return `<div class="panel-item">
              <div class="panel-item-title">${esc(r.policy_number||'')} <span class="days-chip ${cls}">${days}d</span></div>
              <div class="panel-item-sub">${esc(r.insurer||'')} · Expires ${esc(r.expiry_date)}</div>
            </div>`;
          }).join('')}
    </div>
    <div class="card">
      <div class="card-header">
        <div class="card-title">✓ Open Tasks (${tasks.length})</div>
        <a href="ams_tasks.html?customer_code=${esc(client.customer_code)}" class="btn btn-ghost btn-sm">＋ Add Task</a>
      </div>
      ${tasks.length === 0
        ? '<p style="color:var(--mid-text);font-size:13px;font-style:italic">No open tasks</p>'
        : tasks.map(t => `<div class="panel-item">
            <div class="panel-item-title">${esc(t.title||t.task_type||'Task')}</div>
            <div class="panel-item-sub">${t.due_date?`Due ${esc(t.due_date)}`:'No due date'} · <a href="ams_tasks.html">View</a></div>
          </div>`).join('')}
    </div>`;

  document.getElementById('page-content').innerHTML = `
    <div class="detail-layout">
      <div class="detail-main">${profileHtml}${contactHtml}${policiesHtml}</div>
      <div class="detail-panel">${panelHtml}</div>
    </div>`;
}

function renderContactCard(contact, field, label) {
  if (!contact) {
    return `<div class="contact-card">
      <div class="contact-card-header" onclick="this.parentElement.classList.toggle('contact-collapsed')">
        <span class="contact-name" style="color:var(--mid-text);font-style:italic">${label} — empty</span>
        <span>›</span>
      </div>
    </div>`;
  }
  return `<div class="contact-card">
    <div class="contact-card-header" onclick="this.parentElement.classList.toggle('contact-collapsed')">
      <span class="contact-name">${contact.title?esc(contact.title)+' ':''} ${esc(contact.full_name)}</span>
      <span>›</span>
    </div>
    <div class="contact-body">
      <div class="field-grid">
        ${contact.phone?`<div class="field-item"><div class="field-label">Phone</div><div class="field-value"><a href="tel:${esc(contact.phone)}">${esc(contact.phone)}</a></div></div>`:''}
        ${contact.email?`<div class="field-item"><div class="field-label">Email</div><div class="field-value"><a href="mailto:${esc(contact.email)}">${esc(contact.email)}</a></div></div>`:''}
        ${contact.birthday?`<div class="field-item"><div class="field-label">Birthday</div><div class="field-value">${esc(contact.birthday)}</div></div>`:''}
        ${contact.marital_status?`<div class="field-item"><div class="field-label">Marital</div><div class="field-value">${esc(contact.marital_status)}</div></div>`:''}
        ${contact.relation?`<div class="field-item"><div class="field-label">Relation</div><div class="field-value">${esc(contact.relation)}</div></div>`:''}
      </div>
      <div style="margin-top:10px;text-align:right">
        <button class="btn btn-ghost btn-sm" onclick="startContactEdit('${field}')">✏️ Edit</button>
      </div>
    </div>
  </div>`;
}

function renderPolicyCard(p) {
  const type = p.policy_type || 'other';
  const statusClass = `status-${p.status}`;
  const days = daysUntil(p.expiry_date);
  return `<a href="ams_policies.html?policy_id=${esc(p.id)}" class="policy-card-link"><div class="policy-card ${type}">
    <div class="policy-card-header">
      <span class="policy-type-badge ${type}">${type.toUpperCase()}</span>
      <span class="policy-status-badge ${statusClass}">${esc(p.status||'')}</span>
    </div>
    <div class="policy-number">${esc(p.policy_number||'No number')}</div>
    <div class="policy-insurer">${esc(p.insurer||'')}</div>
    <div class="policy-dates">
      <div><div class="policy-date-label">Effective</div><div class="policy-date-value">${esc(p.effective_date||'')}</div></div>
      <div><div class="policy-date-label">Expires</div><div class="policy-date-value">${esc(p.expiry_date||'')}${days <= 60 && days > 0 ? ` <span class="days-chip ${days<=14?'days-urgent':'days-warning'}">${days}d</span>` : ''}</div></div>
    </div>
  </div></a>`;
}

// ─────────────────────────────────────────
// Task 8: Inline Edit
// ─────────────────────────────────────────
function startEdit() {
  const c = clientData;
  const tags = (c.tags||[]).join(', ');
  const isCorporation = c.client_type === 'corporation';
  // Try to split full_name into parts for individual
  let firstName = '', middleName = '', lastName = '';
  if (!isCorporation) {
    const parts = (c.full_name || '').trim().split(/\s+/);
    if (parts.length === 1) { firstName = parts[0]; }
    else if (parts.length === 2) { firstName = parts[0]; lastName = parts[1]; }
    else { firstName = parts[0]; lastName = parts[parts.length - 1]; middleName = parts.slice(1, -1).join(' '); }
  }
  document.getElementById('profile-display').innerHTML = `
    <div class="form-grid">
      <div class="form-group"><label class="form-label">Type</label><select class="form-select" id="e-type" onchange="toggleEditNameFields()"><option value="individual" ${!isCorporation?'selected':''}>Individual</option><option value="corporation" ${isCorporation?'selected':''}>Corporation</option></select></div>
      <div class="form-group" style="align-self:end"></div>
      <div id="edit-name-individual" style="${isCorporation?'display:none':'display:contents'}">
        <div class="form-group"><label class="form-label">First Name <span class="req">*</span></label><input class="form-input" id="e-firstname" value="${esc(firstName)}"></div>
        <div class="form-group"><label class="form-label">Last Name <span class="req">*</span></label><input class="form-input" id="e-lastname" value="${esc(lastName)}"></div>
        <div class="form-group full"><label class="form-label">Middle Name</label><input class="form-input" id="e-middlename" value="${esc(middleName)}"></div>
      </div>
      <div id="edit-name-corporation" style="${isCorporation?'display:contents':'display:none'}">
        <div class="form-group full"><label class="form-label">Business Name <span class="req">*</span></label><input class="form-input" id="e-businessname" value="${esc(isCorporation ? c.full_name : '')}"></div>
      </div>
      <div class="form-group"><label class="form-label">Phone</label><input class="form-input" id="e-phone" type="tel" value="${esc(c.phone||'')}"></div>
      <div class="form-group"><label class="form-label">Email</label><input class="form-input" id="e-email" type="email" value="${esc(c.email||'')}"></div>
      <div class="form-group full"><label class="form-label">Address</label><input class="form-input" id="e-address" value="${esc(c.address||'')}"></div>
      <div class="form-group"><label class="form-label">Birthday</label><input class="form-input" id="e-birthday" type="date" value="${esc(c.birthday||'')}"></div>
      <div class="form-group"><label class="form-label">Referral Source</label><input class="form-input" id="e-referral" value="${esc(c.referral_source||'')}"></div>
      <div class="form-group"><label class="form-label">Tags</label><input class="form-input" id="e-tags" value="${esc(tags)}"><span class="form-hint">Comma-separated</span></div>
      <div class="form-group full"><label class="form-label">Notes</label><textarea class="form-textarea" id="e-notes">${esc(c.notes||'')}</textarea></div>
    </div>
    <div style="margin-top:16px;display:flex;justify-content:flex-end;gap:10px">
      <button class="btn btn-ghost" onclick="cancelEdit()">Cancel</button>
      <button class="btn btn-primary" onclick="saveProfile()">Save</button>
    </div>`;
}

function toggleEditNameFields() {
  const type = document.getElementById('e-type').value;
  document.getElementById('edit-name-individual').style.display = type === 'individual' ? 'contents' : 'none';
  document.getElementById('edit-name-corporation').style.display = type === 'corporation' ? 'contents' : 'none';
}

function cancelEdit() {
  loadClient();
}

async function saveProfile() {
  const clientType = document.getElementById('e-type').value;
  let name = '';
  if (clientType === 'individual') {
    const first = document.getElementById('e-firstname').value.trim();
    const middle = document.getElementById('e-middlename').value.trim();
    const last = document.getElementById('e-lastname').value.trim();
    if (!first || !last) { showToast('First and last name are required', 'error'); return; }
    name = [first, middle, last].filter(Boolean).join(' ');
  } else {
    name = document.getElementById('e-businessname').value.trim();
    if (!name) { showToast('Business name is required', 'error'); return; }
  }
  const tags = document.getElementById('e-tags').value.trim()
    ? document.getElementById('e-tags').value.split(',').map(t=>t.trim()).filter(Boolean) : [];
  const payload = {
    full_name:       name,
    client_type:     clientType,
    phone:           document.getElementById('e-phone').value.trim() || null,
    email:           document.getElementById('e-email').value.trim() || null,
    address:         document.getElementById('e-address').value.trim() || null,
    birthday:        document.getElementById('e-birthday').value || null,
    referral_source: document.getElementById('e-referral').value.trim() || null,
    tags, notes:     document.getElementById('e-notes').value.trim() || null,
  };
  try {
    const { error } = await db.from('clients').update(payload).eq('id', clientId);
    if (error) throw error;
    showToast('Profile updated');
    await loadClient();
  } catch(e) { showToast(e.message, 'error'); }
}

// ── Contact Inline Edit ──
function startContactEdit(field) {
  const contact = clientData[field] || {};
  const card = document.querySelector(`[onclick*="${field}"]`).closest('.contact-card');
  const body = card.querySelector('.contact-body');
  body.innerHTML = `
    <div class="form-grid">
      <div class="form-group"><label class="form-label">Title</label><select class="form-select" id="${field}-title"><option value="">—</option><option ${contact.title==='Mr.'?'selected':''}>Mr.</option><option ${contact.title==='Mrs.'?'selected':''}>Mrs.</option><option ${contact.title==='Ms.'?'selected':''}>Ms.</option><option ${contact.title==='Dr.'?'selected':''}>Dr.</option></select></div>
      <div class="form-group"><label class="form-label">Name</label><input class="form-input" id="${field}-name" value="${esc(contact.full_name||'')}"></div>
      <div class="form-group"><label class="form-label">Phone</label><input class="form-input" id="${field}-phone" type="tel" value="${esc(contact.phone||'')}"></div>
      <div class="form-group"><label class="form-label">Email</label><input class="form-input" id="${field}-email" type="email" value="${esc(contact.email||'')}"></div>
      <div class="form-group"><label class="form-label">Birthday</label><input class="form-input" id="${field}-birthday" type="date" value="${esc(contact.birthday||'')}"></div>
      <div class="form-group"><label class="form-label">Marital Status</label><select class="form-select" id="${field}-marital"><option value="">—</option><option value="single" ${contact.marital_status==='single'?'selected':''}>Single</option><option value="married" ${contact.marital_status==='married'?'selected':''}>Married</option><option value="divorced" ${contact.marital_status==='divorced'?'selected':''}>Divorced</option><option value="widowed" ${contact.marital_status==='widowed'?'selected':''}>Widowed</option></select></div>
      <div class="form-group full"><label class="form-label">Relation</label><input class="form-input" id="${field}-relation" value="${esc(contact.relation||'')}"></div>
    </div>
    <div style="margin-top:10px;display:flex;justify-content:flex-end;gap:10px">
      <button class="btn btn-ghost btn-sm" onclick="loadClient()">Cancel</button>
      <button class="btn btn-primary btn-sm" onclick="saveContact('${field}')">Save</button>
    </div>`;
}

async function saveContact(field) {
  const name = document.getElementById(`${field}-name`).value.trim();
  const contactData = name ? {
    title:          document.getElementById(`${field}-title`).value || null,
    full_name:      name,
    phone:          document.getElementById(`${field}-phone`).value.trim() || null,
    email:          document.getElementById(`${field}-email`).value.trim() || null,
    birthday:       document.getElementById(`${field}-birthday`).value || null,
    marital_status: document.getElementById(`${field}-marital`).value || null,
    relation:       document.getElementById(`${field}-relation`).value.trim() || null,
  } : null;
  try {
    const { error } = await db.from('clients').update({ [field]: contactData }).eq('id', clientId);
    if (error) throw error;
    showToast('Contact updated');
    await loadClient();
  } catch(e) { showToast(e.message, 'error'); }
}

// ─────────────────────────────────────────
// Task 9: Delete Client
// ─────────────────────────────────────────
function confirmDelete() {
  document.getElementById('delete-name').textContent = clientData?.full_name || '';
  document.getElementById('delete-modal').classList.add('open');
}

function closeDeleteModal() {
  document.getElementById('delete-modal').classList.remove('open');
}

function safeCloseDeleteModal() {
  if (!confirm('确定要关闭吗？')) return;
  closeDeleteModal();
}

async function deleteClient() {
  const btn = document.querySelector('#delete-modal .btn-danger');
  btn.disabled = true; btn.textContent = 'Deleting…';
  try {
    const { error } = await db.from('clients').delete().eq('id', clientId);
    if (error) throw error;
    showToast('Client deleted');
    setTimeout(() => { location.href = 'ams_clients.html'; }, 800);
  } catch(e) {
    closeDeleteModal();
    const msg = e.message?.includes('foreign key') || e.code === '23503'
      ? 'Cannot delete — remove linked policies first'
      : e.message;
    showToast(msg, 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'Delete';
  }
}

// ── Modal backdrop close ──
document.getElementById('delete-modal').addEventListener('click', function(e) { if (e.target === this) safeCloseDeleteModal(); });
</script>
<script src="ams_i18n.js"></script>
</body>
</html>
